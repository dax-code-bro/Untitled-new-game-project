<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>Legend · Play</title>
<style>
  html,body{margin:0;height:100%;background:#000;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;color:#E8E8E8;overflow:hidden}
  .bar{display:flex;align-items:center;gap:10px;height:46px;padding:calc(env(safe-area-inset-top,0px)) 12px 0;background:#0A0A0A;border-bottom:1px solid #222}
  .bar a,.bar button{background:none;border:none;color:#C9A84C;font-size:14px;cursor:pointer;text-decoration:none;font-family:inherit}
  .bar .name{font-family:Georgia,serif;letter-spacing:.1em;font-size:14px;color:#C9A84C;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .bar .sp{flex:1}
  .upd{display:none;background:#C9A84C;color:#000;border-radius:6px;padding:6px 10px;font-weight:700;font-size:12px}
  .upd.show{display:inline-block}
  iframe{width:100%;height:calc(100dvh - 46px);border:none;background:#fff;display:block}
  .msg{padding:60px 24px;text-align:center;color:#888;line-height:1.6}
  .msg a{color:#C9A84C}
</style>
</head>
<body>
  <div class="bar">
    <a href="/">← Legend</a>
    <span class="name" id="name"></span>
    <span class="sp"></span>
    <button class="upd" id="upd">🔄 Update — Refresh</button>
    <button id="refresh">↻ Refresh</button>
  </div>
  <iframe id="frame" sandbox="allow-scripts allow-pointer-lock allow-same-origin allow-forms allow-modals"></iframe>
  <div class="msg" id="msg" style="display:none"></div>

<script>
  const params = new URLSearchParams(location.search);
  const frame = document.getElementById('frame');
  const msg = document.getElementById('msg');
  const nameEl = document.getElementById('name');
  const updBtn = document.getElementById('upd');
  let currentId = null, currentVer = null;

  function fail(t){ frame.style.display='none'; updBtn.style.display='none'; document.getElementById('refresh').style.display='none'; msg.style.display='block'; msg.innerHTML = t; }

  async function gunzipB64(enc){
    let b = enc.replace(/-/g,'+').replace(/_/g,'/'); while(b.length%4) b+='=';
    const bin = atob(b); const bytes = new Uint8Array(bin.length);
    for(let i=0;i<bin.length;i++) bytes[i]=bin.charCodeAt(i);
    const ds = new DecompressionStream('gzip');
    const stream = new Blob([bytes]).stream().pipeThrough(ds);
    const buf = await new Response(stream).arrayBuffer();
    return new TextDecoder().decode(buf);
  }
  function readLocal(id){ try{ const list=JSON.parse(localStorage.getItem('legend_aigb'))||[]; return list.find(a=>a.id===id); }catch(e){ return null; } }

  async function load(){
    const g = params.get('g');
    const pid = params.get('play');
    if(g){
      try{ frame.srcdoc = await gunzipB64(g); nameEl.textContent='Shared game'; }
      catch(e){ fail('This game link is invalid or damaged.'); }
      return;
    }
    if(pid){
      const a = readLocal(pid);
      if(!a){ fail("This game isn't saved on this device.<br>Ask the creator for a <b>share link</b> instead."); return; }
      currentId = pid; currentVer = a.version;
      nameEl.textContent = a.name || 'Play';
      document.title = 'Legend · ' + (a.name || 'Play');
      frame.srcdoc = a.html;
      return;
    }
    fail('No game specified. <a href="/">Open Legend</a>');
  }

  document.getElementById('refresh').addEventListener('click', ()=>{
    if(currentId){ const a=readLocal(currentId); if(a){ currentVer=a.version; frame.srcdoc=a.html; updBtn.classList.remove('show'); return; } }
    location.reload();
  });
  updBtn.addEventListener('click', ()=> document.getElementById('refresh').click());
  // If the game is updated in Legend (another tab), offer a refresh.
  window.addEventListener('storage', ()=>{
    if(!currentId) return;
    const a = readLocal(currentId);
    if(a && a.version !== currentVer) updBtn.classList.add('show');
  });

  load();
</script>
</body>
</html>
