name: Deploy THE BIRCH to GitHub Pages

on:
  push:
    branches: [claude/horror-game-3d-room-j0v9yk]
    paths: ['horror-game/**', '.github/workflows/pages.yml']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build the site
        run: |
          node horror-game/build-standalone.mjs
          mkdir -p _site
          cp horror-game/standalone.html _site/index.html
          cp horror-game/manifest.webmanifest horror-game/sw.js horror-game/icon.svg horror-game/logo.svg _site/
          touch _site/.nojekyll
      - name: Push to gh-pages
        run: |
          cd _site
          git init -b gh-pages
          git config user.name "claude"
          git config user.email "noreply@anthropic.com"
          git add -A
          git commit -m "deploy THE BIRCH ${{ github.sha }}"
          git push --force "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" gh-pages
