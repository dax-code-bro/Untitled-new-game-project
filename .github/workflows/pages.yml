name: Deploy THE BIRCH to GitHub Pages

on:
  push:
    branches: [claude/horror-game-3d-room-j0v9yk]
    paths: ['horror-game/**', '.github/workflows/pages.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Build the site
        run: |
          node horror-game/build-standalone.mjs
          mkdir -p _site
          cp horror-game/standalone.html _site/index.html
          cp horror-game/manifest.webmanifest horror-game/sw.js horror-game/icon.svg horror-game/logo.svg _site/
      - uses: actions/configure-pages@v4
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
