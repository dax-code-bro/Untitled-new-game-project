<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 220" role="img" aria-label="The Birch">
  <defs>
    <linearGradient id="pale" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#efe6cc"/>
      <stop offset="1" stop-color="#c9bd9e"/>
    </linearGradient>
  </defs>
  <rect width="640" height="220" fill="none"/>
  <!-- the mannequin stands in for the I of BIRCH -->
  <g stroke="url(#pale)" stroke-width="7" stroke-linecap="round" fill="none">
    <ellipse cx="352" cy="72" rx="13" ry="17" fill="url(#pale)" stroke="none"/>
    <line x1="352" y1="90" x2="352" y2="140"/>
    <line x1="352" y1="100" x2="322" y2="138"/>
    <line x1="352" y1="100" x2="382" y2="138"/>
    <line x1="322" y1="138" x2="318" y2="168"/>
    <line x1="382" y1="138" x2="386" y2="168"/>
    <line x1="352" y1="140" x2="336" y2="196"/>
    <line x1="352" y1="140" x2="368" y2="196"/>
  </g>
  <!-- the smile nobody drew yet -->
  <g stroke="#2a2118" stroke-width="3" stroke-linecap="round" fill="none" opacity="0.85">
    <line x1="346" y1="65" x2="346.5" y2="75"/>
    <line x1="358" y1="65" x2="358.5" y2="75"/>
    <path d="M344 80 Q352 88 360 80"/>
  </g>
  <!-- wordmark: tall, thin, carved -->
  <g fill="#e9dfc6" font-family="Arial Narrow, Haettenschweiler, Impact, sans-serif" letter-spacing="6">
    <text x="66" y="118" font-size="44" opacity="0.85">THE</text>
    <text x="66" y="186" font-size="92" font-weight="bold">B</text>
    <text x="146" y="186" font-size="92" font-weight="bold">I</text>
    <text x="188" y="186" font-size="92" font-weight="bold">R</text>
    <text x="404" y="186" font-size="92" font-weight="bold">C</text>
    <text x="486" y="186" font-size="92" font-weight="bold">H</text>
  </g>
  <!-- grain scratches through the letters -->
  <g stroke="#08090a" stroke-width="1.4" opacity="0.5">
    <line x1="70" y1="150" x2="580" y2="146"/>
    <line x1="80" y1="168" x2="560" y2="171"/>
  </g>
</svg>
