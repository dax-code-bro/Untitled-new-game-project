<meta charset="utf8">
<title>Legend — hands</title>
<style>
  html,body{margin:0;height:100%;background:#0b0d10;overflow:hidden}
  canvas{display:block}
  #label{position:fixed;left:0;right:0;bottom:0;padding:10px 16px;
    font:12px ui-monospace,Menlo,monospace;color:#cfcabb;background:rgba(0,0,0,.45)}
</style>
<div id="label"></div>
<script src="../engine/legend-engine.js"></script>
<script>
/* A bench for one hand at a time. A hand is a thing every player has
   two of and has looked at for their whole life, so any error in it is
   obvious in a picture and invisible in code — which is exactly why it
   gets its own page. ?pose=relaxed|fist|gripStock|... &side=r|l
   &view=back|palm|edge|three &what=hand|arm|leg */
const q = new URLSearchParams(location.search);
const poseName = q.get('pose') || 'relaxed';
const side = (q.get('side') || 'r') === 'l' ? -1 : 1;
const view = q.get('view') || 'three';
const what = q.get('what') || 'hand';

const game = LE.create({ antialias: true, shadows: true, quality: 'high' });
game.setSky('day');
const r = game.renderer;
r.sun.direction.set(0.42, 0.66, 0.62).normalize();
r.sun.intensity = 3.0;
r.sky.intensity = 1.3;
r.sky.ground.set(0.30, 0.29, 0.27);
r.fog.density = 0;
r.shadows.enabled = true;
r.shadows.distance = 2;
r.shadows.split = 4;
game.box({ at: [0, -1.2, 0], size: [4, 0.06, 4],
  material: { color: 0x8d897e, roughness: 0.8 }, static: true });

const bones = /^sleeve:/.test(what) ? [{ id: 's', parent: null, offset: [0,0,0], rest: [0,0,0], len: 0.3, geo: what, mat: 'linen' }]
  : what === 'boot' ? [{ id: 'boot', parent: null, offset: [0,0,0], rest: [0,0,0], len: 0.26, geo: 'boot', mat: 'boot' }]
  : what === 'leg' ? LE.legBones(side)
  : what === 'arm' ? LE.armBones(side).concat(LE.handBones(side).map(b => (
      b.parent === null ? Object.assign({}, b, { parent: 'wrist' }) : b)))
  : LE.handBones(side);

const pose = LE.fpPose(poseName);
const angles = /^sleeve:/.test(what) ? {}
  : what === 'boot' ? {}
  : what === 'leg'
  ? { thigh: { flex: 0.30 }, knee: { flex: 0 }, shank: { flex: 0.55 }, boot: { flex: -2.0 } }
  : LE.fpJointAngles(pose, side);

const solved = LE.fpSolve(bones, angles, new LE.Vec3(0, 0, 0), new LE.Quat());
const box = new LE.Aabb();
let n = 0;
for (const [id, node] of solved) {
  const b = node.bone;
  if (!b.geo) continue;
  const geo = LE.fpGeometry(b.geo, b.geo === 'palm' || b.geo === 'boot' ? side : 1);
  if (!geo) continue;
  n++;
  const m = Object.assign({ color: 0xffffff }, LE.FP_MATERIAL[b.mat] || LE.FP_MATERIAL.skin);
  const a = game.mesh({ geometry: geo, key: `fp:${b.geo}:${side}:${id}`, material: m,
    at: [node.p.x, node.p.y, node.p.z], physics: false });
  a.setRotation(node.q);
  box.expandPoint(node.p);
  const tip = new LE.Vec3(0, 0, b.len || 0).applyQuat(node.q).add(node.p);
  box.expandPoint(tip);
}
box.expandScalar(0.02);
const c = box.center(), e = box.extents();
const span = Math.max(e.x, e.y, e.z) * 2.2;
const dist = span / (2 * Math.tan(15 * Math.PI / 180));
const dir = view === 'palm' ? [0, -1, 0.15] : view === 'back' ? [0, 1, 0.15]
  : view === 'edge' ? [1, 0.05, 0.1] : [0.75, 0.62, -0.5];
const d = Math.hypot(dir[0], dir[1], dir[2]);
game.camera.fov = 30 * Math.PI / 180;
game.lookAt([c.x + dir[0] / d * dist, c.y + dir[1] / d * dist, c.z + dir[2] / d * dist], [c.x, c.y, c.z]);
document.getElementById('label').textContent =
  `${what} · ${side > 0 ? 'right' : 'left'} · pose ${poseName} · view ${view} · ${n} bones`;
game.start();
window.__ready = true;
</script>
