const SAVE_KEY = 'moor_save_v1';
function saveGame(){
  try{
    const data = {
      seed:SEED, money:G.money, day:G.day, clock:G.clock, org:G.org, inv:G.inv,
      props:G.props, home:G.home, guideLand:G.guideLand, guideFish:G.guideFish,
      stats:G.stats, x:P.car?P.car.x:P.x, y:P.car?P.car.y:P.y
    };
    localStorage.setItem(SAVE_KEY, JSON.stringify(data));
  }catch(e){}
}
function loadGame(){
  try{
    const raw = localStorage.getItem(SAVE_KEY); if(!raw) return false;
    const d = JSON.parse(raw);
    if(!d || d.seed !== SEED) return false;
    G.money = d.money ?? G.money; G.day = d.day ?? 1; G.clock = d.clock ?? 480;
    G.org = d.org || null; G.inv = Object.assign(G.inv, d.inv||{});
    G.props = d.props || []; G.home = (d.home===undefined?null:d.home);
    G.guideLand = d.guideLand || {}; G.guideFish = d.guideFish || {};
    G.stats = Object.assign(G.stats, d.stats||{});
    for(const id of G.props){ if(buildings[id]){ buildings[id].owned = true; buildings[id].forSale = false; } }
    if(typeof d.x === 'number' && !isWaterAt(d.x,d.y)){ P.x = d.x; P.y = d.y; }
    return true;
  }catch(e){ return false; }
}
setInterval(()=>{ if(G.phase==='play') saveGame(); }, 20000);

/* ============================ RENDER =================================== */
let camX = 0, camY = 0, camZ = 1, camZT = 1;

const TERRAIN_COL = {
  [T_GRASS]:    ['#4e6b3a','#5a7a42'],
  [T_FOREST]:   ['#33502c','#2c4526'],
  [T_MOUNTAIN]: ['#6e6a62','#7d7a72'],
  [T_SAND]:     ['#cbb98c','#d6c69c'],
  [T_URBAN]:    ['#3f4349','#464a51']
};

function dayFactor(){
  // 0 = deep night, 1 = full day
  const h = G.clock/60;
  if(h < 5)  return 0;
  if(h < 7)  return (h-5)/2;
  if(h < 18) return 1;
  if(h < 20) return 1-(h-18)/2;
  return 0;
}

function render(){
  const df = dayFactor();

  if(G.phase === 'boot'){ drawBoot(); return; }
  if(G.phase === 'title'){ drawTitle(); return; }

  if(G.mode === 'interior'){ drawInterior(); drawHUD(df); drawOverlays(); return; }

  const pp = playerPos();
  const targetZ = P.car ? 0.72 : 1.0;
  camZT = lerp(camZT, targetZ, 0.05);
  camZ = camZT;
  camX = lerp(camX, pp.x, 0.12);
  camY = lerp(camY, pp.y, 0.12);

  const viewW = (W/camZ) * 0.72 + 380;
  const scale = W / viewW;
  const halfW = W/(2*scale), halfH = H/(2*scale);
  const left = camX-halfW, right = camX+halfW, top = camY-halfH, bot = camY+halfH;

  CX.save();
  CX.fillStyle = '#0a0d12'; CX.fillRect(0,0,W,H);
  CX.translate(W/2, H/2); CX.scale(scale, scale); CX.translate(-camX, -camY);

  drawTerrain(left,right,top,bot,df);
  drawRoads(left,right,top,bot,df);
  drawProps(left,right,top,bot,df);
  drawBuildings(left,right,top,bot,df);
  drawEntities(left,right,top,bot,df);
  drawParticles();

  CX.restore();

  drawNight(df);
  drawHUD(df);
  drawOverlays();
}

function drawTerrain(l,r,t,b,df){
  const cx0 = clamp(Math.floor(l/CELL)-1,0,GN-1), cx1 = clamp(Math.ceil(r/CELL)+1,0,GN-1);
  const cy0 = clamp(Math.floor(t/CELL)-1,0,GN-1), cy1 = clamp(Math.ceil(b/CELL)+1,0,GN-1);
  const wob = Math.sin(G.t*0.7)*0.5+0.5;
  for(let cy=cy0; cy<=cy1; cy++){
    for(let cx=cx0; cx<=cx1; cx++){
      const i = cellAt(cx,cy), ty = cellType[i], sh = cellShade[i];
      let col;
      if(ty === T_WATER){
        const deep = cellDeep[i];
        const base = deep ? [16,44,74] : [28,72,102];
        const shimmer = Math.sin((cx*0.7+cy*0.9) + G.t*0.9)*7;
        col = 'rgb('+Math.round(base[0]+shimmer)+','+Math.round(base[1]+shimmer)+','+Math.round(base[2]+shimmer+sh*10)+')';
      } else {
        const pair = TERRAIN_COL[ty] || TERRAIN_COL[T_GRASS];
        col = sh > 0.5 ? pair[0] : pair[1];
        if(ty === T_MOUNTAIN){
          const hgt = cellHeight[i];
          if(hgt > 0.62) col = sh>0.5 ? '#9a9791' : '#8e8b85';
          if(hgt > 0.70) col = '#cfd3d6';
        }
      }
      CX.fillStyle = col;
      CX.fillRect(cx*CELL-0.6, cy*CELL-0.6, CELL+1.2, CELL+1.2);
    }
  }
  // shoreline foam
  CX.strokeStyle = 'rgba(220,240,255,0.20)'; CX.lineWidth = 3;
  for(let cy=cy0; cy<=cy1; cy++){
    for(let cx=cx0; cx<=cx1; cx++){
      if(cellType[cellAt(cx,cy)] !== T_WATER) continue;
      for(const [ox,oy] of [[1,0],[-1,0],[0,1],[0,-1]]){
        const nx = cx+ox, ny = cy+oy;
        if(nx<0||ny<0||nx>=GN||ny>=GN) continue;
        if(cellType[cellAt(nx,ny)] === T_WATER) continue;
        const px = cx*CELL + (ox>0?CELL:0), py = cy*CELL + (oy>0?CELL:0);
        CX.beginPath();
        if(ox!==0){ CX.moveTo(px, cy*CELL); CX.lineTo(px, cy*CELL+CELL); }
        else { CX.moveTo(cx*CELL, py); CX.lineTo(cx*CELL+CELL, py); }
        CX.globalAlpha = 0.5 + wob*0.35;
        CX.stroke(); CX.globalAlpha = 1;
      }
    }
  }
}

function drawRoads(l,r,t,b,df){
  const list = [];
  for(let i=0;i<edges.length;i++){
    const e = edges[i];
    if(Math.max(e.x1,e.x2) < l-200 || Math.min(e.x1,e.x2) > r+200) continue;
    if(Math.max(e.y1,e.y2) < t-200 || Math.min(e.y1,e.y2) > b+200) continue;
    list.push(e);
  }
  // asphalt
  CX.lineCap = 'butt';
  for(const e of list){
    CX.strokeStyle = e.bridge ? '#5b5348' : '#2b2f35';
    CX.lineWidth = e.w;
    CX.beginPath(); CX.moveTo(e.x1,e.y1); CX.lineTo(e.x2,e.y2); CX.stroke();
  }
  // kerbs
  for(const e of list){
    if(e.zone > 2) continue;
    CX.strokeStyle = 'rgba(190,190,190,0.16)';
    CX.lineWidth = e.w*0.94;
    CX.beginPath(); CX.moveTo(e.x1,e.y1); CX.lineTo(e.x2,e.y2); CX.stroke();
    CX.strokeStyle = '#2b2f35';
    CX.lineWidth = e.w*0.86;
    CX.beginPath(); CX.moveTo(e.x1,e.y1); CX.lineTo(e.x2,e.y2); CX.stroke();
  }
  // centre lines
  CX.setLineDash([26,22]);
  for(const e of list){
    CX.strokeStyle = e.hwy ? 'rgba(240,215,120,0.75)' : 'rgba(230,230,230,0.42)';
    CX.lineWidth = e.hwy ? 3.4 : 2.4;
    CX.beginPath(); CX.moveTo(e.x1,e.y1); CX.lineTo(e.x2,e.y2); CX.stroke();
  }
  CX.setLineDash([]);
  // traffic lights
  for(const n of nodes){
    if(!n.light) continue;
    if(n.x < l-100 || n.x > r+100 || n.y < t-100 || n.y > b+100) continue;
    const green = Math.sin(n.lightPhase) > 0;
    CX.fillStyle = green ? '#3ce06a' : '#ff5252';
    CX.beginPath(); CX.arc(n.x, n.y, 6, 0, TAU); CX.fill();
    CX.fillStyle = 'rgba(0,0,0,0.4)';
    CX.beginPath(); CX.arc(n.x, n.y, 6, 0, TAU); CX.stroke();
  }
  // street lamps at night
  if(df < 0.5){
    for(const e of list){
      if(e.zone > 2) continue;
      const n = Math.max(1, Math.floor(e.len/210));
      for(let k=0;k<n;k++){
        const tt = (k+0.5)/n;
        const x = lerp(e.x1,e.x2,tt), y = lerp(e.y1,e.y2,tt);
        const g = CX.createRadialGradient(x,y,0,x,y,110);
        g.addColorStop(0,'rgba(255,225,150,'+(0.30*(1-df*2))+')');
        g.addColorStop(1,'rgba(255,225,150,0)');
        CX.fillStyle = g; CX.beginPath(); CX.arc(x,y,110,0,TAU); CX.fill();
      }
    }
  }
}

function drawProps(l,r,t,b,df){
  const cxm = (l+r)/2, cym = (t+b)/2;
  const list = propsNear(cxm, cym, Math.max(r-l, b-t)/2 + 400);
  for(const p of list){
    if(p.x < l-60 || p.x > r+60 || p.y < t-60 || p.y > b+60) continue;
    const ox = (p.x - camX)*0.00042*p.h, oy = (p.y - camY)*0.00042*p.h;
    // shadow
    CX.fillStyle = 'rgba(0,0,0,0.22)';
    CX.beginPath(); CX.ellipse(p.x+p.r*0.3, p.y+p.r*0.35, p.r*0.9, p.r*0.55, 0, 0, TAU); CX.fill();
    if(p.rock){
      CX.fillStyle = p.tone>0.5 ? '#7d7a73' : '#6d6a64';
      CX.beginPath(); CX.ellipse(p.x+ox, p.y+oy, p.r, p.r*0.82, p.tone*3, 0, TAU); CX.fill();
      CX.fillStyle = 'rgba(255,255,255,0.10)';
      CX.beginPath(); CX.ellipse(p.x+ox-p.r*0.25, p.y+oy-p.r*0.28, p.r*0.5, p.r*0.34, 0, 0, TAU); CX.fill();
    }else{
      CX.fillStyle = p.tone>0.6 ? '#2f4f2a' : p.tone>0.3 ? '#385c30' : '#2a4726';
      CX.beginPath(); CX.arc(p.x+ox, p.y+oy, p.r, 0, TAU); CX.fill();
      CX.fillStyle = 'rgba(255,255,255,0.09)';
      CX.beginPath(); CX.arc(p.x+ox-p.r*0.3, p.y+oy-p.r*0.32, p.r*0.5, 0, TAU); CX.fill();
    }
  }
}

function drawBuildings(l,r,t,b,df){
  const cxm = (l+r)/2, cym = (t+b)/2;
  const list = buildingsNear(cxm, cym, Math.max(r-l, b-t)/2 + 500)
    .filter(bd => bd.x > l-260 && bd.x < r+260 && bd.y > t-260 && bd.y < b+260);
  list.sort((a,c)=> a.y - c.y);

  const night = 1 - df;
  for(const bd of list){
    const k = 0.00050;
    let ox = (bd.x - camX)*k*bd.height, oy = (bd.y - camY)*k*bd.height;
    const mag = Math.hypot(ox,oy), cap = bd.height*0.85;
    if(mag > cap){ ox = ox/mag*cap; oy = oy/mag*cap; }

    const x0 = bd.x-bd.w/2, y0 = bd.y-bd.h/2, x1 = bd.x+bd.w/2, y1 = bd.y+bd.h/2;

    // ground shadow
    CX.fillStyle = 'rgba(0,0,0,0.26)';
    CX.fillRect(x0+7, y0+9, bd.w, bd.h);

    // extruded sides
    CX.fillStyle = shade(bd.color, -0.32);
    CX.beginPath();
    CX.moveTo(x0,y0); CX.lineTo(x1,y0); CX.lineTo(x1,y1); CX.lineTo(x0,y1); CX.closePath();
    CX.moveTo(x0+ox,y0+oy); CX.lineTo(x1+ox,y0+oy); CX.lineTo(x1+ox,y1+oy); CX.lineTo(x0+ox,y1+oy); CX.closePath();
    CX.fill('evenodd');
    // connect the two rects so the sides look solid
    CX.beginPath();
    CX.moveTo(x0,y0); CX.lineTo(x0+ox,y0+oy); CX.lineTo(x1+ox,y0+oy); CX.lineTo(x1,y0); CX.closePath();
    CX.moveTo(x1,y0); CX.lineTo(x1+ox,y0+oy); CX.lineTo(x1+ox,y1+oy); CX.lineTo(x1,y1); CX.closePath();
    CX.moveTo(x0,y1); CX.lineTo(x0+ox,y1+oy); CX.lineTo(x1+ox,y1+oy); CX.lineTo(x1,y1); CX.closePath();
    CX.moveTo(x0,y0); CX.lineTo(x0+ox,y0+oy); CX.lineTo(x0+ox,y1+oy); CX.lineTo(x0,y1); CX.closePath();
    CX.fill();

    // roof
    CX.fillStyle = bd.color;
    CX.fillRect(x0+ox, y0+oy, bd.w, bd.h);
    CX.strokeStyle = 'rgba(0,0,0,0.30)'; CX.lineWidth = 1.4;
    CX.strokeRect(x0+ox, y0+oy, bd.w, bd.h);
    // roof detail
    CX.fillStyle = shade(bd.color, 0.10);
    CX.fillRect(x0+ox+6, y0+oy+6, bd.w-12, bd.h-12);
    if(bd.height > 80){
      CX.fillStyle = shade(bd.color, -0.18);
      CX.fillRect(bd.x+ox-14, bd.y+oy-14, 28, 28);
    }

    // windows on the facing side (only when tall enough to see)
    if(bd.height > 50 && Math.hypot(ox,oy) > 6){
      const rows = Math.max(1, Math.floor(bd.height/34));
      const cols = Math.max(1, Math.floor((bd.dHoriz ? bd.w : bd.h)/26));
      for(let rw=0; rw<rows; rw++){
        for(let cl=0; cl<cols; cl++){
          const fx = (cl+0.5)/cols, fy = (rw+0.6)/rows;
          const px = lerp(x0, x1, fx) + ox*fy;
          const py = lerp(y0, y1, 0.5) + oy*fy + (bd.dHoriz? 0 : 0);
          const lit = night > 0.45 && ((rw*7 + cl*13 + bd.id) % 10) / 10 < bd.lit*0.8;
          CX.fillStyle = lit ? 'rgba(255,225,150,0.85)' : 'rgba(20,26,34,0.45)';
          CX.fillRect(px-4, py-4, 8, 6);
        }
      }
    }

    // door marker
    const dOn = dist2(P.x,P.y,bd.doorX,bd.doorY) < 120*120 && !P.car;
    CX.fillStyle = bd.forSale ? '#4cd47a' : bd.owned ? '#7ac6ff' : '#c8a05a';
    CX.fillRect(bd.doorX-7, bd.doorY-4, 14, 8);
    if(dOn){
      CX.strokeStyle = 'rgba(255,255,255,0.9)'; CX.lineWidth = 2;
      CX.strokeRect(bd.doorX-9, bd.doorY-6, 18, 12);
    }
    if(bd.forSale){
      CX.fillStyle = '#4cd47a';
      CX.beginPath(); CX.arc(bd.doorX, bd.doorY-18, 4, 0, TAU); CX.fill();
    }
  }
}

function shade(hex, amt){
  const h = hex.replace('#','');
  let R = parseInt(h.substring(0,2),16), Gg = parseInt(h.substring(2,4),16), B = parseInt(h.substring(4,6),16);
  R = clamp(Math.round(R + 255*amt),0,255);
  Gg = clamp(Math.round(Gg + 255*amt),0,255);
  B = clamp(Math.round(B + 255*amt),0,255);
  return 'rgb('+R+','+Gg+','+B+')';
}

function drawCar(c, df){
  CX.save();
  CX.translate(c.x, c.y); CX.rotate(c.a);
  const L = c.L, Wd = c.Wd;
  // shadow
  CX.fillStyle = 'rgba(0,0,0,0.30)';
  roundRect(-L/2+4, -Wd/2+5, L, Wd, 6); CX.fill();
  // body
  CX.fillStyle = c.col;
  roundRect(-L/2, -Wd/2, L, Wd, 6); CX.fill();
  CX.strokeStyle = 'rgba(0,0,0,0.35)'; CX.lineWidth = 1.4;
  roundRect(-L/2, -Wd/2, L, Wd, 6); CX.stroke();
  // roof / cabin
  CX.fillStyle = shade(c.col, -0.22);
  roundRect(-L*0.16, -Wd*0.38, L*0.44, Wd*0.76, 4); CX.fill();
  // windshield
  CX.fillStyle = 'rgba(150,200,230,0.55)';
  roundRect(L*0.12, -Wd*0.34, L*0.14, Wd*0.68, 3); CX.fill();
  roundRect(-L*0.30, -Wd*0.34, L*0.12, Wd*0.68, 3); CX.fill();
  // police livery
  if(c.police){
    CX.fillStyle = '#1e3a6a';
    CX.fillRect(-L*0.5, -Wd*0.5, L*0.28, Wd);
    const flash = Math.sin(G.t*22) > 0;
    CX.fillStyle = flash ? '#ff3b3b' : '#3b6bff';
    CX.fillRect(-L*0.10, -Wd*0.5-3, L*0.20, 5);
  }
  // headlights at night
  if(df < 0.55){
    CX.fillStyle = 'rgba(255,240,190,0.95)';
    CX.fillRect(L/2-3, -Wd*0.36, 3, 5); CX.fillRect(L/2-3, Wd*0.36-5, 3, 5);
    CX.fillStyle = 'rgba(255,60,60,0.9)';
    CX.fillRect(-L/2, -Wd*0.36, 2.5, 5); CX.fillRect(-L/2, Wd*0.36-5, 2.5, 5);
  }
  if(c.damage > 40){
    CX.fillStyle = 'rgba(40,40,40,0.5)';
    CX.fillRect(L*0.2, -Wd*0.4, L*0.24, Wd*0.8);
  }
  CX.restore();

  // headlight cones
  if(df < 0.5 && Math.abs(c.sp) > 8){
    CX.save(); CX.translate(c.x,c.y); CX.rotate(c.a);
    const g = CX.createLinearGradient(L/2,0, L/2+150,0);
    g.addColorStop(0,'rgba(255,240,190,0.22)'); g.addColorStop(1,'rgba(255,240,190,0)');
    CX.fillStyle = g;
    CX.beginPath(); CX.moveTo(L/2,-Wd*0.4); CX.lineTo(L/2+160,-58); CX.lineTo(L/2+160,58); CX.lineTo(L/2,Wd*0.4); CX.closePath(); CX.fill();
    CX.restore();
  }
  if(c.honk > 0){
    CX.fillStyle = 'rgba(255,255,255,'+clamp(c.honk,0,1)*0.9+')';
    CX.font = 'bold 15px sans-serif'; CX.textAlign='center';
    CX.fillText('HONK', c.x, c.y - c.Wd - 8);
  }
  if(c.crashed){
    CX.fillStyle = 'rgba(255,180,80,0.9)';
    CX.font = 'bold 14px sans-serif'; CX.textAlign='center';
    CX.fillText('!', c.x, c.y - c.Wd - 10);
  }
}
function roundRect(x,y,w,h,r){
  CX.beginPath();
  CX.moveTo(x+r,y); CX.lineTo(x+w-r,y); CX.quadraticCurveTo(x+w,y,x+w,y+r);
  CX.lineTo(x+w,y+h-r); CX.quadraticCurveTo(x+w,y+h,x+w-r,y+h);
  CX.lineTo(x+r,y+h); CX.quadraticCurveTo(x,y+h,x,y+h-r);
  CX.lineTo(x,y+r); CX.quadraticCurveTo(x,y,x+r,y); CX.closePath();
}

function drawPerson(x,y,a,walkT,shirt,pants,skin,scale){
  const s = scale || 1;
  CX.save(); CX.translate(x,y); CX.rotate(a);
  CX.fillStyle = 'rgba(0,0,0,0.28)';
  CX.beginPath(); CX.ellipse(2*s, 3*s, 9*s, 6.5*s, 0, 0, TAU); CX.fill();
  const swing = Math.sin(walkT)*3.2*s;
  // legs
  CX.fillStyle = pants;
  CX.fillRect(-2*s, -5*s + swing, 4.5*s, 5*s);
  CX.fillRect(-2*s,  0.5*s - swing, 4.5*s, 5*s);
  // body
  CX.fillStyle = shirt;
  CX.beginPath(); CX.ellipse(0,0, 7*s, 5.6*s, 0, 0, TAU); CX.fill();
  // arms
  CX.fillStyle = shirt;
  CX.fillRect(0, -7*s - swing*0.5, 5*s, 2.6*s);
  CX.fillRect(0,  4.4*s + swing*0.5, 5*s, 2.6*s);
  // head
  CX.fillStyle = skin;
  CX.beginPath(); CX.arc(2.5*s, 0, 4.2*s, 0, TAU); CX.fill();
  CX.fillStyle = 'rgba(0,0,0,0.35)';
  CX.beginPath(); CX.arc(2.5*s, 0, 4.2*s, -0.9, 0.9); CX.fill();
  CX.restore();
}

function drawEntities(l,r,t,b,df){
  // animals
  for(const a of animals){
    if(a.x<l-80||a.x>r+80||a.y<t-80||a.y>b+80) continue;
    CX.save(); CX.translate(a.x,a.y); CX.rotate(a.a);
    const s = a.sp.s;
    CX.fillStyle = 'rgba(0,0,0,0.26)';
    CX.beginPath(); CX.ellipse(2, 3, s*0.62, s*0.40, 0, 0, TAU); CX.fill();
    CX.fillStyle = a.sp.c;
    CX.beginPath(); CX.ellipse(0,0, s*0.60, s*0.36, 0, 0, TAU); CX.fill();
    CX.beginPath(); CX.arc(s*0.55, 0, s*0.24, 0, TAU); CX.fill();     // head
    CX.fillStyle = shade(a.sp.c, -0.25);
    const gait = Math.sin(a.t*8 + a.spd*0.05)*s*0.14;
    CX.fillRect(-s*0.4, -s*0.34+gait, s*0.16, s*0.30);
    CX.fillRect( s*0.24, -s*0.34-gait, s*0.16, s*0.30);
    CX.restore();
    if(a.tagged){
      CX.fillStyle = 'rgba(120,230,160,0.95)';
      CX.font = 'bold 11px sans-serif'; CX.textAlign = 'center';
      CX.fillText('✓', a.x, a.y - a.sp.s*0.8);
    }
  }
  // parked + moving cars
  for(const c of cars){
    if(c === P.car) continue;
    if(c.x<l-90||c.x>r+90||c.y<t-90||c.y>b+90) continue;
    drawCar(c, df);
  }
  // people
  for(const p of peds){
    if(p.x<l-60||p.x>r+60||p.y<t-60||p.y>b+60) continue;
    drawPerson(p.x,p.y,p.a,p.walkT,p.shirt,p.pants,p.skin,1);
    if(p.follow){
      CX.strokeStyle = 'rgba(255,212,121,0.9)'; CX.lineWidth = 1.6;
      CX.beginPath(); CX.arc(p.x,p.y,13,0,TAU); CX.stroke();
    }
    if(p.chat > 0){
      speech(p.x, p.y - 22, p.chatTxt, clamp(p.chat,0,1));
    }
  }
  // player
  if(P.car){ drawCar(P.car, df);
    CX.strokeStyle = 'rgba(255,255,255,0.35)'; CX.lineWidth = 2;
    CX.beginPath(); CX.arc(P.car.x,P.car.y, P.car.L*0.62, 0, TAU); CX.stroke();
  }
  else{
    drawPerson(P.x,P.y,P.a,P.walkT,'#ffd479','#2b3a4d','#e8b78c',1.15);
    CX.strokeStyle = 'rgba(255,212,121,0.55)'; CX.lineWidth = 2;
    CX.beginPath(); CX.arc(P.x,P.y,15,0,TAU); CX.stroke();
  }
}
function speech(x,y,txt,alpha){
  CX.font = 'bold 13px -apple-system, sans-serif'; CX.textAlign = 'center';
  const w = CX.measureText(txt).width + 16;
  CX.fillStyle = 'rgba(12,16,22,'+(0.82*alpha)+')';
  roundRect(x-w/2, y-16, w, 22, 7); CX.fill();
  CX.fillStyle = 'rgba(255,255,255,'+alpha+')';
  CX.fillText(txt, x, y);
}

function drawParticles(){
  for(const p of particles){
    CX.globalAlpha = clamp(p.life,0,1);
    CX.fillStyle = p.c;
    CX.beginPath(); CX.arc(p.x,p.y,p.r,0,TAU); CX.fill();
  }
  CX.globalAlpha = 1;
}

function drawNight(df){
  if(df >= 1) return;
  const n = 1-df;
  CX.fillStyle = 'rgba(6,10,26,'+(n*0.52)+')';
  CX.fillRect(0,0,W,H);
}

/* ---------- interior render ---------- */
function drawInterior(){
  const I = G.interior;
  const scale = Math.min(W/(I.w+180), H/(I.h+180), 1.9);
  CX.fillStyle = '#0b0e13'; CX.fillRect(0,0,W,H);
  CX.save();
  CX.translate(W/2, H/2); CX.scale(scale, scale);

  // floor
  CX.fillStyle = I.kind===BT.HOUSE||I.kind===BT.APT ? '#6b5844' : '#5c6068';
  CX.fillRect(-I.w/2, -I.h/2, I.w, I.h);
  // floor tiles
  CX.strokeStyle = 'rgba(0,0,0,0.10)'; CX.lineWidth = 1;
  for(let x=-I.w/2; x<I.w/2; x+=44){ CX.beginPath(); CX.moveTo(x,-I.h/2); CX.lineTo(x,I.h/2); CX.stroke(); }
  for(let y=-I.h/2; y<I.h/2; y+=44){ CX.beginPath(); CX.moveTo(-I.w/2,y); CX.lineTo(I.w/2,y); CX.stroke(); }

  // furniture
  for(const f of I.furn){
    CX.fillStyle = 'rgba(0,0,0,0.28)';
    CX.fillRect(f.x-f.w/2+4, f.y-f.h/2+5, f.w, f.h);
    CX.fillStyle = f.c;
    CX.fillRect(f.x-f.w/2, f.y-f.h/2, f.w, f.h);
    CX.fillStyle = 'rgba(255,255,255,0.10)';
    CX.fillRect(f.x-f.w/2, f.y-f.h/2, f.w, 5);
    if(f.kind==='tv'){ CX.fillStyle = G.inv.console ? '#6ad0ff' : '#101418'; CX.fillRect(f.x-f.w/2+6, f.y-f.h/2+4, f.w-12, f.h-8); }
    if(f.kind==='vault'){ CX.strokeStyle='#c9b26a'; CX.lineWidth=3; CX.beginPath(); CX.arc(f.x,f.y,Math.min(f.w,f.h)*0.3,0,TAU); CX.stroke(); }
  }
  // walls
  for(const w of I.walls){
    CX.fillStyle = '#2a3038';
    CX.fillRect(w.x-w.w/2, w.y-w.h/2, w.w, w.h);
    CX.fillStyle = 'rgba(255,255,255,0.06)';
    CX.fillRect(w.x-w.w/2, w.y-w.h/2, w.w, 3);
  }
  // exit
  CX.fillStyle = '#4cd47a';
  CX.fillRect(-28, I.h/2-8, 56, 12);
  CX.fillStyle = 'rgba(255,255,255,0.9)';
  CX.font = 'bold 12px sans-serif'; CX.textAlign='center';
  CX.fillText('EXIT', 0, I.h/2+22);

  // interaction spots
  for(const s of I.spots){
    const near = dist2(P.ix,P.iy,s.x,s.y) < 52*52;
    CX.strokeStyle = near ? '#ffd479' : 'rgba(255,212,121,0.35)';
    CX.lineWidth = near ? 2.6 : 1.5;
    CX.beginPath(); CX.arc(s.x, s.y, 20, 0, TAU); CX.stroke();
    if(near){
      CX.fillStyle = '#ffd479'; CX.font='bold 12px sans-serif'; CX.textAlign='center';
      CX.fillText(s.label + '  (A)', s.x, s.y - 28);
    }
  }
  // npcs
  for(const n of I.npcs){
    drawPerson(n.x, n.y, n.a + Math.sin(n.t)*0.3, n.t*4, n.shirt, '#2e3a48', n.skin, 1);
    if(n.panic > 0) speech(n.x, n.y-24, pick(['!!!','HELP!','OH NO']), clamp(n.panic/3,0,1));
  }
  // player
  drawPerson(P.ix, P.iy, P.ia, P.walkT, '#ffd479', '#2b3a4d', '#e8b78c', 1.15);
  CX.restore();
}

/* ============================ HUD ====================================== */
function fmtMoney(n){ return '$' + Math.round(n).toLocaleString('en-US'); }
function fmtClock(){
  const h24 = Math.floor(G.clock/60) % 24, m = Math.floor(G.clock%60);
  const ap = h24 < 12 ? 'AM':'PM';
  let h = h24 % 12; if(h===0) h = 12;
  return h + ':' + (m<10?'0':'') + m + ' ' + ap;
}
function panel(x,y,w,h,r){
  CX.fillStyle = 'rgba(10,14,20,0.72)';
  roundRect(x,y,w,h,r||10); CX.fill();
  CX.strokeStyle = 'rgba(255,255,255,0.10)'; CX.lineWidth = 1;
  roundRect(x,y,w,h,r||10); CX.stroke();
}

function drawHUD(df){
  const pad = 12;
  const topY = pad + (window.visualViewport ? 0 : 0);

  // money + clock
  panel(pad, topY, 168, 54, 10);
  CX.fillStyle = '#7de08a'; CX.font = 'bold 19px -apple-system, sans-serif'; CX.textAlign = 'left';
  CX.fillText(fmtMoney(G.money), pad+12, topY+24);
  CX.fillStyle = '#8fa3b8'; CX.font = '12px -apple-system, sans-serif';
  CX.fillText(fmtClock() + '   Day ' + G.day, pad+12, topY+42);

  // wanted stars
  if(G.wanted > 0){
    const sx = pad + 180;
    panel(sx, topY, 30 + Math.ceil(G.wanted)*22, 32, 8);
    for(let i=0;i<Math.ceil(G.wanted);i++){
      star(sx + 20 + i*22, topY+16, 9, (i < G.wanted-0.01) ? '#ffd479' : '#7a6a3a');
    }
  }
  // arrest meter
  if(G.arrestT > 0.02){
    const bw = 150, bx = W/2-bw/2, by = topY+6;
    panel(bx-6, by-6, bw+12, 24, 8);
    CX.fillStyle = '#3a2a2a'; CX.fillRect(bx, by, bw, 12);
    CX.fillStyle = '#ff6b6b'; CX.fillRect(bx, by, bw*clamp(G.arrestT,0,1), 12);
    CX.fillStyle = '#ffb3b3'; CX.font = 'bold 11px sans-serif'; CX.textAlign = 'center';
    CX.fillText('BUSTED', W/2, by+30);
  }

  // org badge
  if(G.org){
    const t = G.org.name + '  ·  ' + G.org.members + '  ·  inf ' + Math.round(G.org.influence);
    CX.font = 'bold 12px -apple-system, sans-serif';
    const w = CX.measureText(t).width + 24;
    panel(W - w - pad, topY, w, 28, 8);
    CX.fillStyle = '#ffd479'; CX.textAlign = 'center';
    CX.fillText(t, W - w/2 - pad, topY+19);
  }

  // speedometer
  if(P.car && G.mode === 'world'){
    const mph = Math.abs(P.car.sp) * 0.31;
    panel(W - 108 - pad, H - 78 - pad, 108, 56, 10);
    CX.fillStyle = '#e8eef5'; CX.font = 'bold 24px -apple-system, sans-serif'; CX.textAlign = 'center';
    CX.fillText(String(Math.round(mph)), W - 54 - pad, H - 44 - pad);
    CX.fillStyle = '#8fa3b8'; CX.font = '11px sans-serif';
    CX.fillText('MPH  ·  ' + P.car.kind.n, W - 54 - pad, H - 28 - pad);
  }

  // minimap
  drawMinimap(df);

  // context prompt
  const prompt = contextPrompt();
  if(prompt){
    CX.font = 'bold 13px -apple-system, sans-serif';
    const w = CX.measureText(prompt).width + 26;
    panel(W/2 - w/2, H - 108, w, 30, 9);
    CX.fillStyle = '#ffd479'; CX.textAlign = 'center';
    CX.fillText(prompt, W/2, H - 88);
  }

  // toast
  if(G.msgT > 0 && G.msg){
    CX.font = 'bold 14px -apple-system, sans-serif';
    const w = Math.min(W-40, CX.measureText(G.msg).width + 30);
    const a = clamp(G.msgT, 0, 1);
    CX.globalAlpha = a;
    panel(W/2-w/2, H - 62, w, 34, 9);
    CX.fillStyle = '#fff'; CX.textAlign = 'center';
    CX.fillText(G.msg, W/2, H - 40);
    CX.globalAlpha = 1;
  }

  // first-run hint — shown once, then never again. The game explains controls, not goals.
  if(G.t < 14 && G.mode === 'world'){
    const a = clamp(14 - G.t, 0, 1) * 0.85;
    CX.globalAlpha = a;
    CX.fillStyle = '#8fa3b8'; CX.font = '12px -apple-system, sans-serif'; CX.textAlign = 'center';
    CX.fillText('Move + A/B  (or WASD / arrows + Space / X)   ·   hold B for your phone', W/2, H - 132);
    CX.globalAlpha = 1;
  }
}
function star(x,y,r,col){
  CX.fillStyle = col; CX.beginPath();
  for(let i=0;i<10;i++){
    const ang = -Math.PI/2 + i*Math.PI/5;
    const rr2 = i%2 ? r*0.45 : r;
    const px = x + Math.cos(ang)*rr2, py = y + Math.sin(ang)*rr2;
    i ? CX.lineTo(px,py) : CX.moveTo(px,py);
  }
  CX.closePath(); CX.fill();
}

function contextPrompt(){
  if(G.mode === 'interior'){
    const I = G.interior;
    if(P.iy > I.h/2 - 34 && Math.abs(P.ix) < 30) return 'A  ·  Leave';
    for(const s of I.spots) if(dist2(P.ix,P.iy,s.x,s.y) < 52*52) return 'A  ·  ' + s.label;
    return '';
  }
  if(P.car) return Math.abs(P.car.sp) < 60 ? 'A  ·  Get out' : '';
  const b = nearestBuildingDoor(P.x,P.y,34);
  if(b) return 'A  ·  Enter ' + (b.forSale ? (b.type + '  (FOR SALE $' + b.price + ')') : b.type);
  const c = nearestCar(P.x,P.y,46);
  if(c) return 'A  ·  ' + (c.parked ? 'Get in' : 'Take the ' + c.kind.n);
  const a = nearestAnimal(P.x,P.y,150);
  if(a && G.inv.camera && !a.tagged) return 'A  ·  Record ' + a.sp.n;
  if(a) return a.sp.n;
  if(waterNear(P.x,P.y,46) && G.inv.rod) return 'A  ·  Fish';
  const p = nearestPed(P.x,P.y,44);
  if(p) return G.org && !p.follow ? 'A  ·  Recruit ($500)' : 'A  ·  Talk';
  return '';
}

/* ---------- minimap ---------- */
const MM = 132;
function drawMinimap(df){
  const x = W - MM - 12, y = H - MM - 12 - (P.car ? 74 : 0);
  const pp = playerPos();
  const span = 1500;
  CX.save();
  CX.beginPath(); CX.arc(x+MM/2, y+MM/2, MM/2, 0, TAU); CX.clip();
  CX.fillStyle = '#0b1016'; CX.fillRect(x,y,MM,MM);

  const sc = MM/span;
  const cx0 = clamp(Math.floor((pp.x-span/2)/CELL),0,GN-1), cx1 = clamp(Math.ceil((pp.x+span/2)/CELL),0,GN-1);
  const cy0 = clamp(Math.floor((pp.y-span/2)/CELL),0,GN-1), cy1 = clamp(Math.ceil((pp.y+span/2)/CELL),0,GN-1);
  for(let cy=cy0;cy<=cy1;cy++) for(let cx=cx0;cx<=cx1;cx++){
    const ty = cellType[cellAt(cx,cy)];
    CX.fillStyle = ty===T_WATER ? '#1d4a6e' : ty===T_URBAN ? '#4a4f57' : ty===T_MOUNTAIN ? '#7a7770'
                 : ty===T_SAND ? '#c2b088' : ty===T_FOREST ? '#2e4a28' : '#4a6438';
    const sx = x + MM/2 + (cx*CELL - pp.x)*sc, sy = y + MM/2 + (cy*CELL - pp.y)*sc;
    CX.fillRect(sx, sy, CELL*sc+1, CELL*sc+1);
  }
  // roads
  CX.strokeStyle = 'rgba(220,220,220,0.5)';
  for(const e of nearEdges(pp.x,pp.y).map(i=>edges[i])){
    CX.lineWidth = e.hwy ? 2.4 : 1.2;
    CX.beginPath();
    CX.moveTo(x+MM/2+(e.x1-pp.x)*sc, y+MM/2+(e.y1-pp.y)*sc);
    CX.lineTo(x+MM/2+(e.x2-pp.x)*sc, y+MM/2+(e.y2-pp.y)*sc);
    CX.stroke();
  }
  // cops
  for(const c of cops){
    CX.fillStyle = c.chase>0 ? '#ff5252' : '#5b8dff';
    CX.beginPath(); CX.arc(x+MM/2+(c.x-pp.x)*sc, y+MM/2+(c.y-pp.y)*sc, 2.6, 0, TAU); CX.fill();
  }
  // owned property
  for(const id of G.props){
    const b = buildings[id]; if(!b) continue;
    CX.fillStyle = '#7ac6ff';
    CX.beginPath(); CX.arc(x+MM/2+(b.x-pp.x)*sc, y+MM/2+(b.y-pp.y)*sc, 2.6, 0, TAU); CX.fill();
  }
  // player
  CX.fillStyle = '#ffd479';
  CX.save();
  CX.translate(x+MM/2, y+MM/2); CX.rotate(P.car ? P.car.a : P.a);
  CX.beginPath(); CX.moveTo(6,0); CX.lineTo(-4,4); CX.lineTo(-4,-4); CX.closePath(); CX.fill();
  CX.restore();
  CX.restore();

  CX.strokeStyle = 'rgba(255,255,255,0.22)'; CX.lineWidth = 2;
  CX.beginPath(); CX.arc(x+MM/2, y+MM/2, MM/2, 0, TAU); CX.stroke();
}

/* ---------- overlays ---------- */
function drawOverlays(){
  const o = G.overlay;
  if(!o) return;
  if(o === 'phone')   return drawPhone();
  if(o === 'map')     return drawBigMap();
  if(o === 'guide')   return drawGuide();
  if(o === 'shop')    return drawShop();
  if(o === 'fish')    return drawFish();
  if(o === 'console') return drawMini();
  if(o === 'arrest')  return drawArrest();
}
function dim(a){ CX.fillStyle = 'rgba(0,0,0,'+(a||0.72)+')'; CX.fillRect(0,0,W,H); }

function drawPhone(){
  dim(0.74);
  const items = phoneItems();
  const cw = Math.min(360, W-40), ch = items.length*46 + 96;
  const x = W/2-cw/2, y = H/2-ch/2;
  panel(x, y, cw, ch, 14);
  CX.fillStyle = '#ffd479'; CX.font = 'bold 15px -apple-system, sans-serif'; CX.textAlign = 'left';
  CX.fillText('PHONE', x+20, y+32);
  CX.fillStyle = '#5f7285'; CX.font = '11px sans-serif';
  CX.fillText('stick = move   A = select   B = close', x+20, y+50);
  for(let i=0;i<items.length;i++){
    const iy = y + 68 + i*46;

      CX.fillStyle = 'rgba(255,212,121,0.14)';
      roundRect(x+12, iy, cw-24, 40, 8); CX.fill();
      CX.strokeStyle = 'rgba(255,212,121,0.5)'; CX.lineWidth=1; roundRect(x+12,iy,cw-24,40,8); CX.stroke();
    }
    CX.fillStyle = i===phone.sel ? '#ffd479' : '#c8d4e0';

    CX.fillText(items[i].t, x+28, iy+25);
  }
  // side info

  info.push('Property: ' + G.props.length);
  info.push('Robberies ' + G.stats.robberies + '   Arrests ' + G.stats.arrests);
  info.push('Miles driven ' + G.stats.milesDriven.toFixed(1));
  info.push('Species tagged ' + Object.keys(G.guideLand).length + '   Fish ' + Object.keys(G.guideFish).length);
  CX.fillStyle = '#5f7285'; CX.font = '11px sans-serif'; CX.textAlign = 'center';
  for(let i=0;i<info.length;i++) CX.fillText(info[i], W/2, y+ch+20+i*15);
}

function drawBigMap(){
  dim(0.88);
  const S = Math.min(W-40, H-140);
  const x = W/2-S/2, y = 66;
  const sc = S/WORLD;
  CX.fillStyle = '#0b1016'; CX.fillRect(x,y,S,S);
  const step = Math.max(1, Math.floor(GN/180));
  for(let cy=0;cy<GN;cy+=step) for(let cx=0;cx<GN;cx+=step){
    const ty = cellType[cellAt(cx,cy)];
    CX.fillStyle = ty===T_WATER ? (cellDeep[cellAt(cx,cy)]?'#123a5c':'#1d4a6e')
                 : ty===T_URBAN ? '#4a4f57' : ty===T_MOUNTAIN ? '#7a7770'
                 : ty===T_SAND ? '#c2b088' : ty===T_FOREST ? '#2e4a28' : '#4a6438';
    CX.fillRect(x + cx*CELL*sc, y + cy*CELL*sc, CELL*sc*step+1, CELL*sc*step+1);
  }
  CX.strokeStyle = 'rgba(230,230,230,0.30)'; CX.lineWidth = 0.6;
  for(const e of edges){
    if(!e.hwy && e.zone > 2) continue;
    CX.lineWidth = e.hwy ? 1.6 : 0.5;
    CX.strokeStyle = e.hwy ? 'rgba(245,215,120,0.75)' : 'rgba(230,230,230,0.22)';
    CX.beginPath(); CX.moveTo(x+e.x1*sc, y+e.y1*sc); CX.lineTo(x+e.x2*sc, y+e.y2*sc); CX.stroke();
  }
  for(const d of DISTRICTS){
    CX.fillStyle = 'rgba(255,255,255,0.92)';
    CX.font = 'bold ' + (d.kind==='city'?12:10) + 'px -apple-system, sans-serif'; CX.textAlign='center';
    CX.fillText(d.name, x+d.x*sc, y+d.y*sc);
  }
  for(const id of G.props){
    const b = buildings[id]; if(!b) continue;
    CX.fillStyle = '#7ac6ff'; CX.beginPath(); CX.arc(x+b.x*sc, y+b.y*sc, 3.4, 0, TAU); CX.fill();
  }
  const pp = playerPos();
  CX.fillStyle = '#ffd479';
  CX.beginPath(); CX.arc(x+pp.x*sc, y+pp.y*sc, 4.6, 0, TAU); CX.fill();
  CX.strokeStyle = '#fff'; CX.lineWidth=1.4; CX.stroke();

  CX.fillStyle = '#8fa3b8'; CX.font = '12px -apple-system, sans-serif'; CX.textAlign='center';
  CX.fillText('MOOR  ·  100 sq mi  ·  ' + worldStats.water.toFixed(0) + '% water  '
    + worldStats.urban.toFixed(0) + '% built  ' + worldStats.wild.toFixed(0) + '% wild', W/2, y+S+26);
  CX.fillStyle = '#5f7285'; CX.font = '11px sans-serif';
  CX.fillText('A or B to go back', W/2, y+S+46);
}

function drawGuide(){
  dim(0.88);
  CX.fillStyle = '#ffd479'; CX.font = 'bold 17px -apple-system, sans-serif'; CX.textAlign='center';
  CX.fillText('FIELD GUIDE', W/2, 54);
  CX.font = '11px sans-serif'; CX.fillStyle = '#5f7285';
  CX.fillText('A or B to go back', W/2, 74);

  const colW = Math.min(300, (W-60)/2);
  const lx = W/2 - colW - 10, rx = W/2 + 10;
  CX.textAlign = 'left';
  CX.fillStyle = '#c8d4e0'; CX.font = 'bold 13px sans-serif';
  CX.fillText('LAND  ' + Object.keys(G.guideLand).length + '/' + LAND_SPECIES.length, lx, 106);
  CX.fillText('WATER ' + Object.keys(G.guideFish).length + '/' + FISH_SPECIES.length, rx, 106);
  CX.font = '11px sans-serif';
  let ly = 126;
  for(const s of LAND_SPECIES){
    const got = G.guideLand[s.n];
    CX.fillStyle = got ? '#9fe0a8' : '#3f4a56';
    CX.fillText((got?'✓ ':'· ') + (got ? s.n : '???' ), lx, ly);
    ly += 15; if(ly > H-30) break;
  }
  let ry = 126;
  for(const s of FISH_SPECIES){
    const got = G.guideFish[s.n];
    CX.fillStyle = got ? '#9fd6e0' : '#3f4a56';
    CX.fillText((got?'✓ ':'· ') + (got ? s.n + '  ' + got + ' lb' : '???'), rx, ry);
    ry += 15; if(ry > H-30) break;
  }
}

function drawShop(){
  dim(0.72);
  const cw = Math.min(340, W-40), ch = shopUI.items.length*44 + 92;
  const x = W/2-cw/2, y = H/2-ch/2;
  panel(x,y,cw,ch,14);
  CX.fillStyle = '#ffd479'; CX.font='bold 15px -apple-system, sans-serif'; CX.textAlign='left';
  CX.fillText(shopUI.title, x+20, y+32);
  CX.fillStyle = '#7de08a'; CX.font='bold 13px sans-serif'; CX.textAlign='right';
  CX.fillText(fmtMoney(G.money), x+cw-20, y+32);
  CX.textAlign='left';
  for(let i=0;i<shopUI.items.length;i++){
    const it = shopUI.items[i], iy = y+56+i*44;
    if(i===shopUI.sel){
      CX.fillStyle='rgba(255,212,121,0.14)'; roundRect(x+12,iy,cw-24,38,8); CX.fill();
      CX.strokeStyle='rgba(255,212,121,0.5)'; CX.lineWidth=1; roundRect(x+12,iy,cw-24,38,8); CX.stroke();
    }
    const rob = it.k==='rob' || it.k==='robbank';
    CX.fillStyle = rob ? '#ff8a8a' : (i===shopUI.sel ? '#ffd479' : '#c8d4e0');
    CX.font = (i===shopUI.sel?'bold ':'')+'13px -apple-system, sans-serif';
    CX.fillText(it.n, x+26, iy+24);
    if(it.p > 0){
      CX.textAlign='right';
      CX.fillStyle = G.money >= it.p ? '#7de08a' : '#ff8a8a';
      CX.fillText('$'+it.p, x+cw-26, iy+24);
      CX.textAlign='left';
    }
  }
  CX.fillStyle='#5f7285'; CX.font='11px sans-serif'; CX.textAlign='center';
  CX.fillText('stick = choose    A = confirm    B = leave', W/2, y+ch-14);
}

function drawFish(){
  dim(0.62);
  const cw = Math.min(360, W-40), ch = 190;
  const x = W/2-cw/2, y = H/2-ch/2;
  panel(x,y,cw,ch,14);
  CX.fillStyle='#8fd6e0'; CX.font='bold 15px -apple-system, sans-serif'; CX.textAlign='center';
  CX.fillText(fishUI.deep ? 'OCEAN' : 'FRESH WATER', W/2, y+30);

  const bw = cw-60, bx = x+30, by = y+70;
  CX.fillStyle='#12202c'; roundRect(bx,by,bw,26,7); CX.fill();
  const zw = bw*fishUI.zone;
  CX.fillStyle='rgba(124,224,140,0.85)';
  CX.fillRect(bx + bw/2 - zw/2, by, zw, 26);

    CX.fillStyle='#ffd479';
    CX.fillRect(bx + bw*fishUI.pos - 2.5, by-5, 5, 36);
  }
  CX.fillStyle='#c8d4e0'; CX.font='12px -apple-system, sans-serif';

    CX.fillStyle = fishUI.result.indexOf('away') !== -1 ? '#ff9a9a' : '#9fe0a8';
    CX.font='bold 14px -apple-system, sans-serif';
    CX.fillText(fishUI.result, W/2, y+128);
    CX.fillStyle='#5f7285'; CX.font='11px sans-serif';

}

function drawMini(){
  dim(0.9);
  const S = Math.min(W-40, H-140, 420);
  const x = W/2, y = H/2;
  CX.save(); CX.translate(x,y);

  CX.strokeStyle='#2a3a4a'; CX.lineWidth=2; CX.strokeRect(-160,-200,320,400);

  for(let i=0;i<26;i++){
    const sx = ((i*97)%300)-150, sy = (((i*53)%380)-190 + mini.t*40)%380-190;

function drawArrest(){
  dim(0.86);
  CX.textAlign='center';
  CX.fillStyle='#ff8a8a'; CX.font='bold 34px -apple-system, sans-serif';
  CX.fillText('BUSTED', W/2, H/2-20);

/* ---------- boot / title ---------- */
const BOOT_STEPS = [
  'shaping the coastline',
  'flooding the lakes',
  'raising the mountains',
  'laying out the districts',
  'paving the roads',
  'raising the buildings',
  'planting the wild',
  'waking the city'
];
function drawBoot(){
  CX.fillStyle = '#05080c'; CX.fillRect(0,0,W,H);
  CX.textAlign='center';
  CX.fillStyle = '#ffd479'; CX.font = 'bold 40px Georgia, serif';
  CX.fillText('MOOR', W/2, H/2 - 30);
  CX.fillStyle = '#3f4a56'; CX.font = '12px -apple-system, sans-serif';
  CX.fillText('100 SQUARE MILES', W/2, H/2 - 6);
  const bw = Math.min(280, W-80), bx = W/2-bw/2, by = H/2+30;
  CX.fillStyle = '#141b24'; roundRect(bx,by,bw,6,3); CX.fill();
  CX.fillStyle = '#ffd479';
  roundRect(bx,by, bw*clamp(G.bootStep/BOOT_STEPS.length,0,1), 6, 3); CX.fill();
  CX.fillStyle = '#5f7285'; CX.font='11px -apple-system, sans-serif';
  CX.fillText(G.bootMsg, W/2, by+26);
}
function drawTitle(){
  // a live, moving world behind the title
  const pp = { x: DISTRICTS[0].x, y: DISTRICTS[0].y };
  camX = pp.x + Math.cos(G.t*0.12)*520;
  camY = pp.y + Math.sin(G.t*0.12)*520;
  const scale = W/1500;
  CX.fillStyle='#0a0d12'; CX.fillRect(0,0,W,H);
  CX.save();
  CX.translate(W/2,H/2); CX.scale(scale,scale); CX.translate(-camX,-camY);
  const halfW = W/(2*scale), halfH = H/(2*scale);
  const df = dayFactor();
  drawTerrain(camX-halfW, camX+halfW, camY-halfH, camY+halfH, df);
  drawRoads(camX-halfW, camX+halfW, camY-halfH, camY+halfH, df);
  drawProps(camX-halfW, camX+halfW, camY-halfH, camY+halfH, df);
  drawBuildings(camX-halfW, camX+halfW, camY-halfH, camY+halfH, df);
  CX.restore();
  CX.fillStyle = 'rgba(4,7,11,0.55)'; CX.fillRect(0,0,W,H);

  CX.textAlign='center';
  CX.fillStyle='#ffd479'; CX.font='bold ' + Math.min(78, W*0.17) + 'px Georgia, serif';
  CX.fillText('MOOR', W/2, H/2 - 10);
  CX.fillStyle='#8fa3b8'; CX.font='13px -apple-system, sans-serif';
  CX.fillText('100 sq mi  ·  ' + worldStats.water.toFixed(0) + '% water  ·  '
    + worldStats.urban.toFixed(0) + '% built  ·  ' + worldStats.wild.toFixed(0) + '% wild', W/2, H/2 + 24);
  const pulse = 0.55 + Math.sin(G.t*3)*0.35;
  CX.fillStyle = 'rgba(255,255,255,'+pulse+')'; CX.font='bold 15px -apple-system, sans-serif';
  CX.fillText('tap anywhere to begin', W/2, H/2 + 66);
  CX.fillStyle='#3f4a56'; CX.font='11px -apple-system, sans-serif';
  CX.fillText('No missions. No tutorial. No one is going to tell you what to do.', W/2, H - 40);
}

/* ---------- boot sequence ---------- */
function bootTick(){
  const s = G.bootStep;
  G.bootMsg = BOOT_STEPS[Math.min(s, BOOT_STEPS.length-1)];
  try{
    if(s === 0){ /* message frame only */ }
    else if(s === 1){ genTerrain(); }
    else if(s === 2){ /* folded into terrain */ }
    else if(s === 3){ /* districts done in terrain */ }
    else if(s === 4){ genRoads(); }
    else if(s === 5){ genBuildings(); }
    else if(s === 6){ genProps(); }
    else if(s === 7){ finishBoot(); return; }
  }catch(err){
    G.bootMsg = 'generation error — retrying';
    console.error(err);
    SEED = (SEED*7 + 13) % 999983; rnd = mulberry32(SEED);
    G.bootStep = 0;
    setTimeout(bootTick, 40); return;
  }
  G.bootStep++;
  setTimeout(bootTick, 24);
}
function finishBoot(){
  // spawn the player on a road in the big city
  let sx = DISTRICTS[0].x, sy = DISTRICTS[0].y;
  let best = null, bd = 1e18;
  for(const e of edges){
    if(e.zone > 2) continue;
    const mx=(e.x1+e.x2)/2, my=(e.y1+e.y2)/2;
    const d = dist2(mx,my,sx,sy);
    if(d < bd && !isWaterAt(mx,my)){ bd = d; best = e; }
  }
  if(best){
    const ang = Math.atan2(best.y2-best.y1, best.x2-best.x1);
    P.x = (best.x1+best.x2)/2 + Math.cos(ang+Math.PI/2)*(best.w*0.75);
    P.y = (best.y1+best.y2)/2 + Math.sin(ang+Math.PI/2)*(best.w*0.75);
  } else { P.x = sx; P.y = sy; }
  let guard = 0;
  while((isWaterAt(P.x,P.y) || collideCircleBuildings(P.x,P.y,P.r).hit) && guard++ < 300){
    P.x += rr(-90,90); P.y += rr(-90,90);
    P.x = clamp(P.x, 100, WORLD-100); P.y = clamp(P.y, 100, WORLD-100);
  }
  loadGame();
  camX = P.x; camY = P.y;
  G.phase = 'title';
}
function startGame(){
  G.phase = 'play';
  G.t = 0;
  streamWorld();
}

/* ---------- main loop (always running, from the first frame) ---------- */
let last = performance.now();
function frame(now){
  let dt = (now - last)/1000;
  last = now;
  if(!(dt > 0)) dt = 0.016;
  dt = Math.min(dt, 0.05);
  try{
    if(G.phase === 'title' || G.phase === 'boot') G.t += dt;
    update(dt);
    render();
  }catch(err){
    console.error(err);
    CX.setTransform(DPR,0,0,DPR,0,0);
    CX.fillStyle='#05080c'; CX.fillRect(0,0,W,H);
    CX.fillStyle='#ff8a8a'; CX.font='13px monospace'; CX.textAlign='center';
    CX.fillText('recovering…', W/2, H/2);
  }
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

// any key also starts the game (desktop)
window.addEventListener('keydown', ()=>{ if(G.phase === 'title') startGame(); });

// kick off world generation
setTimeout(bootTick, 30);
</script>
