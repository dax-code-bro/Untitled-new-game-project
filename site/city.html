<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no" />
<title>MOOR — Open World</title>
<meta name="theme-color" content="#0b0f14" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<style>
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  html,body{height:100%;overflow:hidden;background:#05080c}
  body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;color:#fff;touch-action:none;user-select:none;-webkit-user-select:none}
  canvas{display:block;position:fixed;inset:0;width:100%;height:100%}
  #nameWrap{position:fixed;inset:0;z-index:50;display:none;align-items:center;justify-content:center;background:rgba(0,0,0,.82);padding:20px}
  #nameWrap.show{display:flex}
  #nameCard{width:100%;max-width:420px;background:#0e141c;border:1px solid #2b3a4d;border-radius:14px;padding:22px}
  #nameCard h3{font-size:17px;margin-bottom:6px;color:#ffd479}
  #nameCard p{font-size:13px;color:#8fa3b8;line-height:1.5;margin-bottom:14px}
  #nameCard input{width:100%;background:#060a0f;border:1px solid #2b3a4d;border-radius:9px;color:#fff;font-size:16px;padding:13px 14px;outline:none;font-family:inherit}
  #nameCard input:focus{border-color:#ffd479}
  #nameBtns{display:flex;gap:9px;margin-top:14px}
  #nameBtns button{flex:1;border:none;border-radius:9px;padding:13px;font-size:14px;font-weight:700;cursor:pointer;font-family:inherit}
  #nameOk{background:#ffd479;color:#111}
  #nameCancel{background:#1b2634;color:#8fa3b8}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="nameWrap">
  <div id="nameCard">
    <h3 id="nameTitle">Name your organization</h3>
    <p id="nameSub">Nobody asked you to do this. Nobody will stop you either.</p>
    <input id="nameInput" maxlength="26" autocomplete="off" autocorrect="off" spellcheck="false" placeholder="The Moor Syndicate" />
    <div id="nameBtns"><button id="nameOk">Found it</button><button id="nameCancel">Not yet</button></div>
  </div>
</div>
<script>
'use strict';
/* =========================================================================
   MOOR — open-world sandbox.  100 sq mi · 30% water · 40% built · 30% wild.
   The game never tells you what to do. That is the entire point.
   ========================================================================= */

/* ---------- canvas ---------- */
const CV = document.getElementById('c');
const CX = CV.getContext('2d', { alpha:false });
let W = 0, H = 0, DPR = 1;
function resize(){
  DPR = Math.min(2, window.devicePixelRatio || 1);
  W = Math.max(320, window.innerWidth); H = Math.max(240, window.innerHeight);
  CV.width = Math.floor(W*DPR); CV.height = Math.floor(H*DPR);
  CV.style.width = W+'px'; CV.style.height = H+'px';
  CX.setTransform(DPR,0,0,DPR,0,0);
  CX.imageSmoothingEnabled = true;
}
window.addEventListener('resize', resize);
window.addEventListener('orientationchange', ()=>setTimeout(resize,120));
resize();

/* ---------- math / rng ---------- */
const TAU = Math.PI*2;
const clamp = (v,a,b)=> v<a?a:(v>b?b:v);
const lerp  = (a,b,t)=> a+(b-a)*t;
const dist2 = (ax,ay,bx,by)=>{ const dx=ax-bx, dy=ay-by; return dx*dx+dy*dy; };
const dist  = (ax,ay,bx,by)=> Math.sqrt(dist2(ax,ay,bx,by));
function angLerp(a,b,t){ let d=(b-a)%TAU; if(d>Math.PI)d-=TAU; if(d<-Math.PI)d+=TAU; return a+d*t; }

function mulberry32(a){
  return function(){
    a |= 0; a = a + 0x6D2B79F5 | 0;
    let t = Math.imul(a ^ a>>>15, 1|a);
    t = t + Math.imul(t ^ t>>>7, 61|t) ^ t;
    return ((t ^ t>>>14) >>> 0) / 4294967296;
  };
}
let SEED = 77021;
let rnd = mulberry32(SEED);
const rr   = (a,b)=> a + rnd()*(b-a);
const ri   = (a,b)=> Math.floor(a + rnd()*(b-a+1));
const pick = (arr)=> arr[Math.floor(rnd()*arr.length)|0];

function makeNoise(seed){
  const r = mulberry32(seed), G = 256, tab = new Float32Array(G*G);
  for(let i=0;i<G*G;i++) tab[i] = r();
  const at = (ix,iy)=> tab[((iy & (G-1))*G) + (ix & (G-1))];
  const sm = t => t*t*(3-2*t);
  return function(x,y){
    const x0 = Math.floor(x), y0 = Math.floor(y);
    const fx = sm(x-x0), fy = sm(y-y0);
    const a = at(x0,y0), b = at(x0+1,y0), c = at(x0,y0+1), d = at(x0+1,y0+1);
    const t = a + (b-a)*fx;
    return t + ((c + (d-c)*fx) - t) * fy;
  };
}
function fbm(n,x,y,oct,gain){
  let s=0,a=0.5,f=1,tot=0;
  for(let i=0;i<oct;i++){ s += a*n(x*f,y*f); tot += a; a*=gain; f*=2; }
  return s/tot;
}

/* ---------- world constants ---------- */
const WORLD = 16000;          // 16000 units square == the fictional 10mi x 10mi
const MI    = WORLD/10;       // one "mile" in world units
const CELL  = 125;
const GN    = Math.round(WORLD/CELL);   // 128 x 128 terrain cells
const GC    = GN*GN;

const T_WATER=0, T_URBAN=1, T_GRASS=2, T_MOUNTAIN=3, T_FOREST=4, T_SAND=5;
const U_DOWNTOWN=0, U_MID=1, U_SUBURB=2;

const NS = 400;                          // road node spacing
const RN = Math.round(WORLD/NS);         // 40 x 40 road nodes

/* Terrain arrays */
const cellType   = new Uint8Array(GC);
const cellUrban  = new Uint8Array(GC);   // U_* only meaningful when T_URBAN
const cellHeight = new Float32Array(GC);
const cellDist   = new Int8Array(GC);    // district index or -1
const cellShade  = new Float32Array(GC); // per-cell texture jitter
const cellDeep   = new Uint8Array(GC);   // deep water (ocean) vs shallow

const cellAt = (cx,cy)=> (cy*GN + cx);
function typeAtWorld(x,y){
  const cx = clamp(Math.floor(x/CELL),0,GN-1), cy = clamp(Math.floor(y/CELL),0,GN-1);
  return cellType[cellAt(cx,cy)];
}
const isWaterAt = (x,y)=> typeAtWorld(x,y) === T_WATER;

/* ---------- districts ---------- */
const DISTRICTS = [
  { name:'MOOR CITY',    kind:'city',         weight:1.00, x:0, y:0 },
  { name:'FAIRBAY',      kind:'neighborhood', weight:0.56, x:0, y:0 },
  { name:'NORTHRIDGE',   kind:'neighborhood', weight:0.52, x:0, y:0 },
  { name:'PINE HOLLOW',  kind:'town',         weight:0.30, x:0, y:0 },
  { name:'SALT CREEK',   kind:'town',         weight:0.28, x:0, y:0 },
  { name:'ELDER MILL',   kind:'town',         weight:0.26, x:0, y:0 }
];

/* ---------- generation ---------- */
const worldStats = { water:0, urban:0, wild:0 };

function genTerrain(){
  const nH = makeNoise(SEED*3+11), nL = makeNoise(SEED*7+5), nF = makeNoise(SEED*13+3);

  // 1. base height + ocean gradient (ocean fills the south-east)
  const waterField = new Float32Array(GC);
  for(let cy=0; cy<GN; cy++){
    for(let cx=0; cx<GN; cx++){
      const i = cellAt(cx,cy);
      const u = cx/GN, v = cy/GN;
      let h = fbm(nH, cx/26, cy/26, 5, 0.5);
      h = h*0.82 + fbm(nH, cx/7, cy/7, 3, 0.5)*0.18;
      cellHeight[i] = h;

      // ocean: a soft diagonal shore across the SE corner, wobbled by noise
      const shore = (u*0.62 + v*0.78);
      const wob   = (fbm(nL, cx/19, cy/19, 3, 0.5) - 0.5) * 0.30;
      const ocean = clamp((shore + wob - 0.74) * 3.4, 0, 1);

      // lakes: large blobs punched into the land
      let lake = 0;
      const LAKES = [
        {x:0.24,y:0.26,r:0.135}, {x:0.63,y:0.16,r:0.100}, {x:0.13,y:0.62,r:0.088}
      ];
      for(const L of LAKES){
        const d = Math.hypot(u-L.x, v-L.y);
        const wr = L.r * (0.72 + fbm(nL, cx/11+L.x*40, cy/11+L.y*40, 3, 0.5)*0.66);
        if(d < wr) lake = Math.max(lake, 1 - d/wr);
      }
      waterField[i] = ocean*1.35 + lake*1.15 - h*0.42;
    }
  }

  // 2. exact 30% water by percentile threshold
  const sortedW = Float32Array.from(waterField).sort();
  const wThresh = sortedW[Math.floor(GC*0.70)];
  for(let i=0;i<GC;i++){
    if(waterField[i] >= wThresh){ cellType[i] = T_WATER; cellDeep[i] = waterField[i] > wThresh+0.34 ? 1 : 0; }
    else cellType[i] = T_GRASS;
  }

  // 3. district centres — spread out, on solid land
  const placed = [];
  for(let d=0; d<DISTRICTS.length; d++){
    let best = null, bestScore = -1e9;
    for(let attempt=0; attempt<900; attempt++){
      const cx = ri(9, GN-10), cy = ri(9, GN-10), i = cellAt(cx,cy);
      if(cellType[i] === T_WATER) continue;
      // want dry surroundings
      let dry = 0;
      for(let oy=-5; oy<=5; oy++) for(let ox=-5; ox<=5; ox++){
        const nx = clamp(cx+ox,0,GN-1), ny = clamp(cy+oy,0,GN-1);
        if(cellType[cellAt(nx,ny)] !== T_WATER) dry++;
      }
      let sep = 1e9;
      for(const p of placed) sep = Math.min(sep, Math.hypot(cx-p.cx, cy-p.cy));
      if(placed.length && sep < 22) continue;
      const flat = 1 - Math.abs(cellHeight[i]-0.5);
      const score = dry*1.0 + Math.min(sep,54)*1.7 + flat*10;
      if(score > bestScore){ bestScore = score; best = {cx,cy}; }
    }
    if(!best) best = { cx: ri(14,GN-15), cy: ri(14,GN-15) };
    placed.push(best);
    DISTRICTS[d].x = (best.cx+0.5)*CELL;
    DISTRICTS[d].y = (best.cy+0.5)*CELL;
    DISTRICTS[d].cx = best.cx; DISTRICTS[d].cy = best.cy;
  }

  // 4. exact 40% urban, grown outward from district centres by weight
  const urbanField = new Float32Array(GC).fill(-1);
  for(let cy=0; cy<GN; cy++){
    for(let cx=0; cx<GN; cx++){
      const i = cellAt(cx,cy);
      if(cellType[i] === T_WATER) continue;
      let bestV = -1, bestD = -1;
      for(let d=0; d<DISTRICTS.length; d++){
        const D = DISTRICTS[d];
        const dd = Math.hypot(cx-D.cx, cy-D.cy);
        const wob = fbm(nF, cx/9+d*17, cy/9+d*17, 3, 0.5)*0.30 + 0.85;
        const v = (D.weight * 26 * wob) / (dd + 3.0);
        if(v > bestV){ bestV = v; bestD = d; }
      }
      urbanField[i] = bestV; cellDist[i] = bestD;
    }
  }
  const landVals = [];
  for(let i=0;i<GC;i++) if(cellType[i] !== T_WATER) landVals.push(urbanField[i]);
  landVals.sort((a,b)=>b-a);
  const urbanCount  = Math.floor(GC*0.40);                     // 40% of the whole map
  const uThresh     = landVals[Math.min(urbanCount, landVals.length-1)];
  const downtownCut = landVals[Math.floor(urbanCount*0.11)];
  const midCut      = landVals[Math.floor(urbanCount*0.44)];

  for(let i=0;i<GC;i++){
    if(cellType[i] === T_WATER) continue;
    if(urbanField[i] >= uThresh){
      cellType[i]  = T_URBAN;
      cellUrban[i] = urbanField[i] >= downtownCut ? U_DOWNTOWN
                   : urbanField[i] >= midCut      ? U_MID : U_SUBURB;
    }
  }

  // 5. the remaining 30% — mountains, forest, grass, and beaches at the shore
  const hVals = [];
  for(let i=0;i<GC;i++) if(cellType[i] === T_GRASS) hVals.push(cellHeight[i]);
  hVals.sort((a,b)=>b-a);
  const mThresh = hVals.length ? hVals[Math.floor(hVals.length*0.30)] : 1;
  for(let cy=0; cy<GN; cy++){
    for(let cx=0; cx<GN; cx++){
      const i = cellAt(cx,cy);
      cellShade[i] = mulberry32(i*2654435761 % 2147483647)();
      if(cellType[i] !== T_GRASS) continue;
      if(cellHeight[i] >= mThresh){ cellType[i] = T_MOUNTAIN; continue; }
      let nearWater = false;
      for(let oy=-1; oy<=1 && !nearWater; oy++) for(let ox=-1; ox<=1; ox++){
        const nx = clamp(cx+ox,0,GN-1), ny = clamp(cy+oy,0,GN-1);
        if(cellType[cellAt(nx,ny)] === T_WATER){ nearWater = true; break; }
      }
      if(nearWater){ cellType[i] = T_SAND; continue; }
      if(fbm(nF, cx/8, cy/8, 4, 0.5) > 0.56) cellType[i] = T_FOREST;
    }
  }

  // 6. tally for the HUD / map readout
  let w=0,u=0,wd=0;
  for(let i=0;i<GC;i++){
    if(cellType[i]===T_WATER) w++;
    else if(cellType[i]===T_URBAN) u++;
    else wd++;
  }
  worldStats.water = w/GC*100; worldStats.urban = u/GC*100; worldStats.wild = wd/GC*100;
}

/* ---------- road network ---------- */
const nodes = [];           // {x,y,valid,zone,edges:[edgeIdx],light,lightPhase}
const edges = [];           // {a,b,x1,y1,x2,y2,horiz,len,w,zone,bridge,hwy}
const nodeAt = (nx,ny)=> ny*RN + nx;

function zoneOfNode(n){
  const cx = clamp(Math.floor(n.x/CELL),0,GN-1), cy = clamp(Math.floor(n.y/CELL),0,GN-1);
  const i = cellAt(cx,cy);
  if(cellType[i] === T_WATER) return -1;
  if(cellType[i] === T_URBAN) return cellUrban[i];       // 0,1,2
  if(cellType[i] === T_MOUNTAIN) return 5;
  return 4;                                              // open country
}

function genRoads(){
  for(let ny=0; ny<RN; ny++){
    for(let nx=0; nx<RN; nx++){
      const n = { x:(nx+0.5)*NS, y:(ny+0.5)*NS, nx, ny, edges:[], light:false, lightPhase:0, valid:false, zone:-1 };
      n.zone = zoneOfNode(n);
      n.valid = n.zone >= 0;
      nodes.push(n);
    }
  }
  const CONNECT = { 0:1.00, 1:0.97, 2:0.86, 4:0.24, 5:0.13 };

  function crossesWater(a,b){
    const steps = 6; let hits = 0;
    for(let s=1; s<steps; s++){
      const t = s/steps;
      if(isWaterAt(lerp(a.x,b.x,t), lerp(a.y,b.y,t))) hits++;
    }
    return hits;
  }
  function addEdge(a,b,hwy){
    const wet = crossesWater(a,b);
    const bridge = wet > 0;
    const zone = Math.min(a.zone, b.zone);
    const w = hwy ? 96 : (zone===0 ? 82 : zone===1 ? 70 : zone===2 ? 58 : 44);
    const e = {
      a: nodes.indexOf(a), b: nodes.indexOf(b),
      x1:a.x, y1:a.y, x2:b.x, y2:b.y,
      horiz: Math.abs(a.y-b.y) < 1,
      len: dist(a.x,a.y,b.x,b.y),
      w, zone, bridge, hwy: !!hwy
    };
    edges.push(e);
    const idx = edges.length-1;
    a.edges.push(idx); b.edges.push(idx);
    return idx;
  }

  // local grid
  for(let ny=0; ny<RN; ny++){
    for(let nx=0; nx<RN; nx++){
      const a = nodes[nodeAt(nx,ny)];
      if(!a.valid) continue;
      for(const [ox,oy] of [[1,0],[0,1]]){
        const bx = nx+ox, by = ny+oy;
        if(bx>=RN || by>=RN) continue;
        const b = nodes[nodeAt(bx,by)];
        if(!b.valid) continue;
        const zone = Math.min(a.zone, b.zone);
        const p = CONNECT[zone] !== undefined ? CONNECT[zone] : 0.2;
        if(rnd() > p) continue;
        if(crossesWater(a,b) > 2) continue;    // no long swims
        addEdge(a,b,false);
      }
    }
  }

  // highways: force a path between every neighbouring pair of districts
  const dn = DISTRICTS.map(D=>({
    nx: clamp(Math.round(D.x/NS - 0.5),0,RN-1),
    ny: clamp(Math.round(D.y/NS - 0.5),0,RN-1)
  }));
  function forcePath(A,B){
    let cx = A.nx, cy = A.ny, guard = 0;
    while((cx !== B.nx || cy !== B.ny) && guard++ < 400){
      const prev = nodes[nodeAt(cx,cy)];
      // step along the larger remaining axis, so highways run in long straights
      if(Math.abs(B.nx-cx) >= Math.abs(B.ny-cy) && cx !== B.nx) cx += Math.sign(B.nx-cx);
      else if(cy !== B.ny) cy += Math.sign(B.ny-cy);
      else if(cx !== B.nx) cx += Math.sign(B.nx-cx);
      const cur = nodes[nodeAt(cx,cy)];
      if(!prev.valid) prev.valid = true, prev.zone = Math.max(prev.zone, 4);
      if(!cur.valid)  cur.valid  = true, cur.zone  = Math.max(cur.zone, 4);
      let have = -1;
      for(const ei of prev.edges){
        const e = edges[ei];
        if((e.a===nodes.indexOf(prev)&&e.b===nodes.indexOf(cur)) || (e.b===nodes.indexOf(prev)&&e.a===nodes.indexOf(cur))){ have = ei; break; }
      }
      if(have === -1) addEdge(prev,cur,true);
      else { edges[have].hwy = true; edges[have].w = Math.max(edges[have].w, 96); }
    }
  }
  for(let i=0;i<dn.length;i++){
    // link each district to its two nearest neighbours
    const order = dn.map((d,j)=>({j,d:Math.hypot(d.nx-dn[i].nx, d.ny-dn[i].ny)}))
                    .filter(o=>o.j!==i).sort((a,b)=>a.d-b.d);
    for(let k=0;k<Math.min(2,order.length);k++) forcePath(dn[i], dn[order[k].j]);
  }

  // traffic lights on busy urban intersections
  for(const n of nodes){
    if(n.edges.length >= 3 && n.zone <= 1){ n.light = true; n.lightPhase = rnd()*TAU; }
  }
}

/* ---------- buildings ---------- */
const buildings = [];
const BT = {
  HOUSE:'house', APT:'apartment', SHOP:'store', TOWER:'tower', OFFICE:'office',
  BANK:'bank', GEAR:'outfitter', TECH:'electronics', DINER:'diner', GAS:'gas station'
};
const bGrid = new Map();   // spatial index: "gx,gy" -> [building]
const BGS = 400;
const bkey = (x,y)=> (Math.floor(x/BGS)+','+Math.floor(y/BGS));
function bIndex(b){
  const k = bkey(b.x, b.y);
  let a = bGrid.get(k); if(!a){ a=[]; bGrid.set(k,a); }
  a.push(b);
}
function buildingsNear(x,y,r){
  const out = [];
  const gx0 = Math.floor((x-r)/BGS), gx1 = Math.floor((x+r)/BGS);
  const gy0 = Math.floor((y-r)/BGS), gy1 = Math.floor((y+r)/BGS);
  for(let gy=gy0; gy<=gy1; gy++) for(let gx=gx0; gx<=gx1; gx++){
    const a = bGrid.get(gx+','+gy); if(a) for(const b of a) out.push(b);
  }
  return out;
}

const HOUSE_COLORS = ['#c8b49a','#b8c4c8','#cbbdb0','#a9b8a4','#d0c0ab','#b6a898','#c3ccd2','#d4c7b2'];
const MID_COLORS   = ['#8e9aa8','#9aa4ae','#a4a09a','#87929e','#9c968e','#8fa0a6'];
const TOWER_COLORS = ['#5f6f80','#69798a','#566476','#728294','#607284'];

function genBuildings(){
  for(let ei=0; ei<edges.length; ei++){
    const e = edges[ei];
    if(e.bridge) continue;
    const zone = e.zone;
    if(zone > 2) {                     // country: rare farmhouse
      if(rnd() > 0.14) continue;
    }
    const along = e.horiz ? 'x' : 'y';
    const L = e.len, margin = e.w*0.85 + 26;
    if(L < margin*2 + 70) continue;

    for(const side of [-1, 1]){
      let t = margin;
      while(t < L - margin){
        const isDown = zone === 0, isMid = zone === 1, isSub = zone === 2;
        const wAlong = isDown ? rr(90,190) : isMid ? rr(78,150) : isSub ? rr(64,110) : rr(58,96);
        if(t + wAlong > L - margin) break;
        const depth  = isDown ? rr(90,175) : isMid ? rr(78,132) : isSub ? rr(62,100) : rr(58,92);
        const gap    = isDown ? rr(10,26) : rr(14,34);

        // skip a slot now and then so blocks aren't perfectly uniform
        if(rnd() < (isDown?0.08:isSub?0.22:0.15)){ t += wAlong + gap; continue; }

        const cAlong = t + wAlong/2;
        const off = e.w/2 + depth/2 + 8;
        let bx, by, bw, bh, doorX, doorY;
        if(e.horiz){
          bx = Math.min(e.x1,e.x2) + cAlong; by = e.y1 + side*off;
          bw = wAlong; bh = depth;
          doorX = bx; doorY = by - side*(depth/2);
        }else{
          by = Math.min(e.y1,e.y2) + cAlong; bx = e.x1 + side*off;
          bh = wAlong; bw = depth;
          doorY = by; doorX = bx - side*(depth/2);
        }
        if(bx < 60 || by < 60 || bx > WORLD-60 || by > WORLD-60){ t += wAlong+gap; continue; }
        if(isWaterAt(bx,by)){ t += wAlong+gap; continue; }

        // type + look
        let type, height, color;
        const roll = rnd();
        if(isDown){
          if(roll < 0.42){ type=BT.TOWER;  height=rr(150,330); color=pick(TOWER_COLORS); }
          else if(roll < 0.70){ type=BT.OFFICE; height=rr(80,150); color=pick(MID_COLORS); }
          else if(roll < 0.88){ type=BT.SHOP; height=rr(38,62); color=pick(MID_COLORS); }
          else { type=BT.APT; height=rr(90,170); color=pick(MID_COLORS); }
        } else if(isMid){
          if(roll < 0.34){ type=BT.SHOP; height=rr(34,58); color=pick(MID_COLORS); }
          else if(roll < 0.56){ type=BT.APT; height=rr(70,130); color=pick(MID_COLORS); }
          else if(roll < 0.70){ type=BT.OFFICE; height=rr(58,104); color=pick(MID_COLORS); }
          else if(roll < 0.80){ type=BT.DINER; height=rr(30,44); color='#c9776a'; }
          else if(roll < 0.88){ type=BT.TECH; height=rr(34,52); color='#5c7f9e'; }
          else if(roll < 0.95){ type=BT.GEAR; height=rr(32,50); color='#8a7f5c'; }
          else { type=BT.GAS; height=rr(26,34); color='#d8d2c4'; }
        } else {
          if(roll < 0.78){ type=BT.HOUSE; height=rr(26,44); color=pick(HOUSE_COLORS); }
          else if(roll < 0.88){ type=BT.SHOP; height=rr(28,40); color=pick(MID_COLORS); }
          else if(roll < 0.94){ type=BT.DINER; height=rr(26,36); color='#c9776a'; }
          else { type=BT.GAS; height=rr(24,32); color='#d8d2c4'; }
        }

        const b = {
          x:bx, y:by, w:bw, h:bh, type, height, color,
          doorX, doorY, dSide:side, dHoriz:e.horiz,
          district: cellDist[cellAt(clamp(Math.floor(bx/CELL),0,GN-1), clamp(Math.floor(by/CELL),0,GN-1))],
          zone, id: buildings.length,
          owned:false, forSale:false, price:0, rentDue:0,
          lit: rnd(),                       // window-light seed
          robbedAt:-1e9
        };
        if((type===BT.HOUSE || type===BT.APT) && rnd() < 0.14){
          b.forSale = true;
          b.price = type===BT.HOUSE ? Math.round(rr(8,26))*1000 : Math.round(rr(3,9))*1000;
        }
        buildings.push(b); bIndex(b);
        t += wAlong + gap;
      }
    }
  }

  // guarantee key services in every district
  for(let d=0; d<DISTRICTS.length; d++){
    const mine = buildings.filter(b=>b.district===d);
    if(!mine.length) continue;
    mine.sort((a,b)=> dist2(a.x,a.y,DISTRICTS[d].x,DISTRICTS[d].y) - dist2(b.x,b.y,DISTRICTS[d].x,DISTRICTS[d].y));
    const want = [BT.BANK, BT.GEAR, BT.TECH, BT.SHOP, BT.DINER];
    let k = 0;
    for(const wt of want){
      if(mine.some(b=>b.type===wt)) { if(wt!==BT.BANK) continue; }
      while(k < mine.length && (mine[k].type===BT.BANK)) k++;
      if(k >= mine.length) break;
      const b = mine[k++];
      b.type = wt; b.forSale = false;
      if(wt===BT.BANK){ b.height = Math.max(b.height, 70); b.color = '#c3b98f'; }
      if(wt===BT.GEAR){ b.color = '#8a7f5c'; }
      if(wt===BT.TECH){ b.color = '#5c7f9e'; }
      if(wt===BT.DINER){ b.color = '#c9776a'; }
    }
  }
}

const props = [];      // trees / rocks in the wild — indexed like buildings
const pGrid = new Map();
function pIndex(p){
  const k = bkey(p.x,p.y); let a = pGrid.get(k); if(!a){ a=[]; pGrid.set(k,a); }
  a.push(p);
}
function propsNear(x,y,r){
  const out=[]; const gx0=Math.floor((x-r)/BGS), gx1=Math.floor((x+r)/BGS);
  const gy0=Math.floor((y-r)/BGS), gy1=Math.floor((y+r)/BGS);
  for(let gy=gy0;gy<=gy1;gy++) for(let gx=gx0;gx<=gx1;gx++){
    const a=pGrid.get(gx+','+gy); if(a) for(const p of a) out.push(p);
  }
  return out;
}
function genProps(){
  for(let cy=0; cy<GN; cy++){
    for(let cx=0; cx<GN; cx++){
      const i = cellAt(cx,cy), t = cellType[i];
      if(t===T_WATER || t===T_URBAN || t===T_SAND) continue;
      const density = t===T_FOREST ? 9 : t===T_MOUNTAIN ? 3 : 1.5;
      const n = Math.floor(density * (0.5 + cellShade[i]));
      for(let k=0;k<n;k++){
        const x = cx*CELL + rnd()*CELL, y = cy*CELL + rnd()*CELL;
        if(isWaterAt(x,y)) continue;
        const rock = t===T_MOUNTAIN ? rnd()<0.62 : rnd()<0.08;
        const p = { x, y, rock, r: rock ? rr(9,26) : rr(13,30), tone: rnd(), h: rock? rr(10,30) : rr(30,64) };
        props.push(p); pIndex(p);
      }
    }
  }
}

/* snap a car back onto the nearest road edge (used when a chase ends) */
function reacquireEdge(c){
  let bestEi = -1, bd = 1e18;
  for(const ei of nearEdges(c.x, c.y)){
    const e = edges[ei];
    const d = segDist(c.x, c.y, e.x1, e.y1, e.x2, e.y2);
    if(d < bd){ bd = d; bestEi = ei; }
  }
  if(bestEi === -1){ c.parked = true; return; }
  const e = edges[bestEi];
  // head for whichever end the car is already pointing at
  const toB = Math.cos(c.a)*(e.x2-e.x1) + Math.sin(c.a)*(e.y2-e.y1);
  c.edge = bestEi;
  c.tgt      = toB >= 0 ? e.b : e.a;
  c.prevNode = toB >= 0 ? e.a : e.b;
  c.parked = false;
  c.direct = false;
}

/* place a car on a road edge heading toward node b */
function placeOnEdge(car, ei, dir){
  const e = edges[ei];
  car.edge = ei; car.dir = dir;
  const A = dir>0 ? {x:e.x1,y:e.y1} : {x:e.x2,y:e.y2};
  const B = dir>0 ? {x:e.x2,y:e.y2} : {x:e.x1,y:e.y1};
  car.tgt = dir>0 ? e.b : e.a;
  car.prevNode = dir>0 ? e.a : e.b;
  const t = rnd();
  const ang = Math.atan2(B.y-A.y, B.x-A.x);
  const lane = e.w*0.24;
  car.x = lerp(A.x,B.x,t) + Math.cos(ang+Math.PI/2)*lane;
  car.y = lerp(A.y,B.y,t) + Math.sin(ang+Math.PI/2)*lane;
  car.a = ang;
  car.sp = rr(60, car.top*0.5);
}

/* ---------- streaming: keep the world alive only near the player ---------- */
const STREAM_R = 1900, DESPAWN_R = 2600;
function playerPos(){ return P.car ? {x:P.car.x, y:P.car.y} : {x:P.x, y:P.y}; }

function edgesNear(x,y,r){
  const out = [];
  for(let i=0;i<edges.length;i++){
    const e = edges[i];
    const mx = (e.x1+e.x2)/2, my = (e.y1+e.y2)/2;
    if(Math.abs(mx-x) < r && Math.abs(my-y) < r) out.push(i);
  }
  return out;
}
let nearEdgeCache = { x:-1e9, y:-1e9, list:[] };
function nearEdges(x,y){
  if(dist2(x,y,nearEdgeCache.x,nearEdgeCache.y) > 300*300){
    nearEdgeCache = { x, y, list: edgesNear(x,y,STREAM_R) };
  }
  return nearEdgeCache.list;
}

function streamWorld(){
  const pp = playerPos();
  const list = nearEdges(pp.x, pp.y);

  // ---- traffic
  const TARGET_CARS = 34;
  let live = 0;
  for(let i=cars.length-1;i>=0;i--){
    const c = cars[i];
    if(c === P.car) { live++; continue; }
    if(dist(c.x,c.y,pp.x,pp.y) > DESPAWN_R){ cars.splice(i,1); continue; }
    live++;
  }
  let guard = 0;
  while(live < TARGET_CARS && list.length && guard++ < 40){
    const ei = list[(rnd()*list.length)|0];
    const e = edges[ei];
    const mx=(e.x1+e.x2)/2, my=(e.y1+e.y2)/2;
    const d = dist(mx,my,pp.x,pp.y);
    if(d < 420 || d > STREAM_R) continue;      // never pop in on screen
    const c = newCar(0,0,0,false);
    placeOnEdge(c, ei, rnd()<0.5?1:-1);
    if(e.zone > 2 && rnd() < 0.6) continue;    // country roads stay quiet
    cars.push(c); live++;
  }

  // ---- parked cars along urban kerbs
  const TARGET_PARKED = 16;
  let parked = cars.filter(c=>c.parked).length;
  guard = 0;
  while(parked < TARGET_PARKED && list.length && guard++ < 40){
    const ei = list[(rnd()*list.length)|0];
    const e = edges[ei];
    if(e.zone > 2 || e.bridge) continue;
    const mx=(e.x1+e.x2)/2, my=(e.y1+e.y2)/2;
    const d = dist(mx,my,pp.x,pp.y);
    if(d < 300 || d > STREAM_R) continue;
    const c = newCar(0,0,0,true);
    const t = rr(0.15,0.85);
    const ang = Math.atan2(e.y2-e.y1, e.x2-e.x1);
    const side = rnd()<0.5?1:-1;
    c.x = lerp(e.x1,e.x2,t) + Math.cos(ang+Math.PI/2)*(e.w*0.42)*side;
    c.y = lerp(e.y1,e.y2,t) + Math.sin(ang+Math.PI/2)*(e.w*0.42)*side;
    c.a = ang + (side<0?Math.PI:0);
    c.sp = 0;
    cars.push(c); parked++;
  }

  // ---- pedestrians
  const TARGET_PEDS = 26;
  for(let i=peds.length-1;i>=0;i--){
    if(dist(peds[i].x,peds[i].y,pp.x,pp.y) > DESPAWN_R) peds.splice(i,1);
  }
  guard = 0;
  while(peds.length < TARGET_PEDS && list.length && guard++ < 50){
    const ei = list[(rnd()*list.length)|0];
    const e = edges[ei];
    if(e.zone > 2) continue;
    const t = rr(0.1,0.9);
    const ang = Math.atan2(e.y2-e.y1, e.x2-e.x1);
    const side = rnd()<0.5?1:-1;
    const x = lerp(e.x1,e.x2,t) + Math.cos(ang+Math.PI/2)*(e.w*0.62)*side;
    const y = lerp(e.y1,e.y2,t) + Math.sin(ang+Math.PI/2)*(e.w*0.62)*side;
    const d = dist(x,y,pp.x,pp.y);
    if(d < 260 || d > STREAM_R) continue;
    if(isWaterAt(x,y)) continue;
    peds.push({
      x, y, a:ang + (side<0?Math.PI:0), sp:rr(26,44), walkT:rnd()*10,
      shirt: pick(['#d95f5f','#5f8fd9','#e0c060','#60c090','#b070d0','#e08a50','#dedede','#4a5a6a','#c05080','#40a0a0']),
      pants: pick(['#2e3a48','#3a3a3a','#4a3c2e','#2e4a3a','#404a58']),
      skin:  pick(['#f0c8a0','#d9a877','#b07d4f','#8a5a34','#5f3d22','#f5d6b8']),
      panic:0, chat:0, chatTxt:'', recruit:false, follow:false, mood:rnd(),
      edge:ei, dir:side
    });
  }

  // ---- wildlife
  const TARGET_ANIMALS = 14;
  for(let i=animals.length-1;i>=0;i--){
    if(dist(animals[i].x,animals[i].y,pp.x,pp.y) > DESPAWN_R) animals.splice(i,1);
  }
  guard = 0;
  while(animals.length < TARGET_ANIMALS && guard++ < 60){
    const ang = rnd()*TAU, d = rr(600, STREAM_R);
    const x = pp.x + Math.cos(ang)*d, y = pp.y + Math.sin(ang)*d;
    if(x<0||y<0||x>WORLD||y>WORLD) continue;
    const t = typeAtWorld(x,y);
    if(t===T_WATER || t===T_URBAN) continue;
    const options = LAND_SPECIES.filter(s=>s.habitat.indexOf(t) !== -1);
    if(!options.length) continue;
    // rarer species appear less often
    let sp = null;
    for(let k=0;k<8;k++){ const cand = pick(options); if(rnd() < 1/cand.rare){ sp = cand; break; } }
    if(!sp) sp = options[0];
    animals.push({ x, y, a:rnd()*TAU, sp, sp_i:LAND_SPECIES.indexOf(sp), spd:0,
                   wander:rnd()*TAU, flee:0, t:rnd()*10, tagged:false });
  }

  // ---- police presence scales with heat
  const TARGET_COPS = G.wanted>0 ? Math.min(2 + G.wanted*2, 10) : 2;
  for(let i=cops.length-1;i>=0;i--){
    const c = cops[i];
    if(dist(c.x,c.y,pp.x,pp.y) > DESPAWN_R*1.4){ cops.splice(i,1); continue; }
  }
  guard = 0;
  while(cops.length < TARGET_COPS && list.length && guard++ < 40){
    const ei = list[(rnd()*list.length)|0];
    const e = edges[ei];
    const mx=(e.x1+e.x2)/2, my=(e.y1+e.y2)/2;
    const d = dist(mx,my,pp.x,pp.y);
    const minD = G.wanted>0 ? 700 : 500;
    if(d < minD || d > STREAM_R*1.2) continue;
    const c = newCar(0,0,0,false);
    placeOnEdge(c, ei, rnd()<0.5?1:-1);
    c.police = true; c.col = '#f0f4f8'; c.top *= 1.22; c.acc *= 1.3;
    cars.push(c); cops.push(c);
  }
}

const keys = Object.create(null);
let anyKeyT = 0;
function keyName(e){
  const k = e.key;
  if(k === ' ' || e.code === 'Space') return 'space';
  if(k && k.length === 1) return k.toLowerCase();
  return (k||'').toLowerCase();
}
window.addEventListener('keydown', e=>{
  const n = keyName(e);
  if(document.activeElement && document.activeElement.tagName === 'INPUT') return;
  if(['arrowup','arrowdown','arrowleft','arrowright','space','tab'].indexOf(n) !== -1) e.preventDefault();
  if(!keys[n]) keys[n+'_p'] = true;      // pressed-this-frame latch
  keys[n] = true; anyKeyT = G.t;
});
window.addEventListener('keyup', e=>{
  const n = keyName(e); keys[n] = false; keys[n+'_h'] = 0;
});
window.addEventListener('blur', ()=>{ for(const k in keys) keys[k] = false; });

const K = {
  up:   ()=> keys['arrowup']||keys['w'],
  down: ()=> keys['arrowdown']||keys['s'],
  left: ()=> keys['arrowleft']||keys['a'],
  right:()=> keys['arrowright']||keys['d'],
  A:    ()=> keys['space'],
  B:    ()=> keys['x'],
  Apress: ()=> consume('space'),
  Bpress: ()=> consume('x')
};
function consume(n){ if(keys[n+'_p']){ keys[n+'_p'] = false; return true; } return false; }

/* B held for 0.45s opens the phone — works with just a stick + two buttons */

/* tap / click anywhere starts the game (required on touch) */

}

/* ============================ ACTIONS ================================== */
function nearestBuildingDoor(x,y,rad){
  const list = buildingsNear(x,y,rad+60);
  let best=null, bd=rad*rad;
  for(const b of list){
    const d = dist2(x,y,b.doorX,b.doorY);
    if(d < bd){ bd = d; best = b; }
  }
  return best;
}
function nearestCar(x,y,rad){
  let best=null, bd=rad*rad;
  for(const c of cars){
    if(c === P.car) continue;
    const d = dist2(x,y,c.x,c.y);
    if(d < bd){ bd = d; best = c; }
  }
  return best;
}
function nearestPed(x,y,rad){
  let best=null, bd=rad*rad;
  for(const p of peds){
    const d = dist2(x,y,p.x,p.y);
    if(d < bd){ bd = d; best = p; }
  }
  return best;
}
function waterNear(x,y,rad){
  for(let a=0;a<12;a++){
    const ang = a/12*TAU;
    const wx = x + Math.cos(ang)*rad, wy = y + Math.sin(ang)*rad;
    if(isWaterAt(wx,wy)) return {x:wx,y:wy};
  }
  return null;
}
function nearestAnimal(x,y,rad){
  let best=null, bd=rad*rad;
  for(const a of animals){
    const d = dist2(x,y,a.x,a.y);
    if(d < bd){ bd = d; best = a; }
  }
  return best;
}

function addHeat(n, why){
  G.wanted = clamp(G.wanted + n, 0, 5);
  G.wantedHeat = Math.max(G.wantedHeat, 12 + n*6);
  if(why) say(why, 2.6);
  if(G.org) G.org.influence += n*3;
}

function enterCar(c){
  if(c.police && !c.parked){ /* stealing a cruiser is bolder */ }
  const wasDriven = !c.parked && c.driver;
  P.car = c; c.player = true; c.driver = null; c.parked = false;
  const ci = cops.indexOf(c); if(ci !== -1) cops.splice(ci,1);
  c.police = c.police;   // keep the livery, lose the badge
  if(wasDriven){
    G.stats.carsStolen++;
    addHeat(c.police ? 2 : 1, 'You took someone’s car.');
    // eject an angry driver
    peds.push({ x:c.x+Math.cos(c.a+1.6)*26, y:c.y+Math.sin(c.a+1.6)*26, a:c.a+1.6, sp:52, walkT:0,
      shirt:pick(['#d95f5f','#5f8fd9','#e0c060']), pants:'#2e3a48', skin:pick(['#f0c8a0','#d9a877','#b07d4f']),
      panic:5, chat:2.6, chatTxt:'HEY! THAT’S MINE!', recruit:false, follow:false, mood:0, edge:-1, dir:1 });
  } else {
    say('', 0);
  }
}
function exitCar(){
  const c = P.car; if(!c) return;
  c.player = false; c.parked = true; c.sp *= 0.2;
  P.x = c.x + Math.cos(c.a + Math.PI/2)*(c.Wd*0.9 + 12);
  P.y = c.y + Math.sin(c.a + Math.PI/2)*(c.Wd*0.9 + 12);
  P.a = c.a; P.car = null;
}

/* ---------- interiors (modular kit, generated on entry) ---------- */
const IW = 520;   // interior room extent
function makeInterior(b){
  const r = mulberry32(b.id*9176 + 13);
  const R = (a,c)=> a + r()*(c-a);
  const kind = b.type;
  const walls = [], furn = [], spots = [], npcs = [];
  let w = 460, h = 360;
  if(kind===BT.TOWER || kind===BT.OFFICE || kind===BT.BANK) { w = 600; h = 420; }
  if(kind===BT.HOUSE) { w = 440; h = 380; }
  if(kind===BT.APT)   { w = 380; h = 320; }

  const exit = { x:0, y:h/2 - 6 };
  // outer walls (4 slabs, gap for the door)
  const TH = 14;
  walls.push({x:0,y:-h/2,w:w,h:TH});
  walls.push({x:-w/2,y:0,w:TH,h:h});
  walls.push({x: w/2,y:0,w:TH,h:h});
  walls.push({x:-w/4-14,y:h/2,w:w/2-28,h:TH});
  walls.push({x: w/4+14,y:h/2,w:w/2-28,h:TH});

  function shelfRow(y0, count, wid){
    for(let i=0;i<count;i++){
      const x = -w/2 + 70 + i*((w-140)/Math.max(1,count-1));
      furn.push({x, y:y0, w:wid, h:26, c:'#6b5b45', kind:'shelf'});
    }
  }
  if(kind===BT.SHOP || kind===BT.GEAR || kind===BT.TECH || kind===BT.GAS){
    shelfRow(-h/2+96, 4, 74); shelfRow(-h/2+176, 4, 74);
    furn.push({x:0, y:h/2-92, w:220, h:30, c:'#8a6a3e', kind:'counter'});
    spots.push({x:0, y:h/2-118, kind:'buy', label:'Counter'});
    npcs.push({x:0, y:h/2-70, shirt:'#4a6a8a', skin:pick(['#f0c8a0','#d9a877','#b07d4f','#8a5a34']), role:'clerk'});
  } else if(kind===BT.BANK){
    furn.push({x:0, y:-h/2+120, w:w-160, h:30, c:'#8a7a4e', kind:'counter'});
    furn.push({x:w/2-90, y:-h/2+56, w:90, h:70, c:'#5a5a60', kind:'vault'});
    spots.push({x:0, y:-h/2+156, kind:'bank', label:'Teller'});
    spots.push({x:w/2-90, y:-h/2+108, kind:'vault', label:'Vault'});
    npcs.push({x:-70, y:-h/2+90, shirt:'#2e4a6a', skin:pick(['#f0c8a0','#d9a877','#b07d4f']), role:'teller'});
    npcs.push({x:80, y:-h/2+90, shirt:'#2e4a6a', skin:pick(['#d9a877','#8a5a34']), role:'teller'});
    npcs.push({x:w/2-170, y:h/2-90, shirt:'#22303c', skin:pick(['#f0c8a0','#b07d4f']), role:'guard'});
  } else if(kind===BT.DINER){
    for(let i=0;i<3;i++) for(let j=0;j<2;j++)
      furn.push({x:-w/2+110+i*130, y:-h/2+110+j*110, w:64, h:64, c:'#7a5a4a', kind:'table'});
    furn.push({x:0, y:h/2-86, w:200, h:28, c:'#8a6a3e', kind:'counter'});
    spots.push({x:0, y:h/2-112, kind:'diner', label:'Order'});
    npcs.push({x:0, y:h/2-64, shirt:'#c06060', skin:pick(['#f0c8a0','#d9a877','#b07d4f']), role:'cook'});
    for(let i=0;i<2;i++) npcs.push({x:R(-w/2+120,w/2-120), y:R(-h/2+120,h/2-160),
      shirt:pick(['#5f8fd9','#e0c060','#60c090']), skin:pick(['#f0c8a0','#d9a877','#8a5a34']), role:'diner'});
  } else if(kind===BT.HOUSE || kind===BT.APT){
    // a partition wall makes it feel like rooms
    walls.push({x:-w/6, y:-h/6, w:TH, h:h/2.2});
    furn.push({x:-w/2+90, y:-h/2+90, w:72, h:104, c:'#5a6a8a', kind:'bed'});
    furn.push({x: w/2-110, y:-h/2+80, w:110, h:22, c:'#3a3a42', kind:'tv'});
    furn.push({x: w/2-110, y:-h/2+150, w:120, h:52, c:'#7a6a5a', kind:'couch'});
    furn.push({x: 40, y:h/2-120, w:90, h:60, c:'#8a7a5a', kind:'table'});
    spots.push({x:-w/2+90, y:-h/2+156, kind:'bed', label:'Bed'});
    spots.push({x: w/2-110, y:-h/2+112, kind:'tv', label:'TV'});
    if(b.forSale && !b.owned) spots.push({x:0, y:h/2-70, kind:'buyhome', label:'FOR SALE'});
  } else {
    // office / tower lobby
    for(let i=0;i<4;i++) furn.push({x:-w/2+110+i*((w-220)/3), y:-h/2+120, w:80, h:44, c:'#6a6a72', kind:'desk'});
    furn.push({x:0, y:-h/2+50, w:150, h:26, c:'#5a5a62', kind:'counter'});
    furn.push({x:-w/2+50, y:h/2-70, w:26, h:26, c:'#3a6a3a', kind:'plant'});
    furn.push({x: w/2-50, y:h/2-70, w:26, h:26, c:'#3a6a3a', kind:'plant'});
    spots.push({x:0, y:-h/2+86, kind:'reception', label:'Reception'});
    for(let i=0;i<3;i++) npcs.push({x:R(-w/2+110,w/2-110), y:R(-h/2+150,h/2-130),
      shirt:pick(['#4a5a7a','#5a6a5a','#6a5a5a']), skin:pick(['#f0c8a0','#d9a877','#b07d4f','#5f3d22']), role:'worker'});
  }

  for(const n of npcs){ n.a = rnd()*TAU; n.t = rnd()*10; n.hx = n.x; n.hy = n.y; }
  return { b, w, h, walls, furn, spots, npcs, exit, kind };
}
function enterBuilding(b){
  G.interior = makeInterior(b);
  G.mode = 'interior';
  P.ix = 0; P.iy = G.interior.h/2 - 40; P.ia = -Math.PI/2;
}
function leaveBuilding(){
  const b = G.interior.b;
  G.mode = 'world'; G.interior = null;
  P.x = b.doorX + (b.dHoriz ? 0 : -b.dSide*26);
  P.y = b.doorY + (b.dHoriz ? -b.dSide*26 : 0);
  if(isWaterAt(P.x,P.y)){ P.x = b.doorX; P.y = b.doorY; }
}

  [BT.GEAR]:  [ {n:'Field Camera', p:180, k:'camera'}, {n:'Fishing Rod', p:120, k:'rod'}, {n:'Hiking Boots', p:60, k:'none'} ],

const shopUI = { items:[], sel:0, title:'', b:null };
function openShop(b){
  const stock = SHOP_STOCK[b.type] || SHOP_STOCK[BT.SHOP];
  shopUI.items = stock.slice();
  shopUI.items.push({n:'— Rob the register —', p:0, k:'rob'});
  shopUI.sel = 0; shopUI.title = b.type.toUpperCase(); shopUI.b = b;

function buyItem(it){
  if(it.k === 'rob'){
    G.overlay = null;
    const b = shopUI.b;
    if(G.t - b.robbedAt < 180){ say('This register is already empty.', 2.6); return; }
    b.robbedAt = G.t;
    const take = Math.round(rr(120, 480));
    G.money += take; G.stats.robberies++;
    if(G.org) G.org.influence += 6;
    addHeat(2, 'You took $'+take+'. The alarm is screaming.');
    if(G.interior) for(const n of G.interior.npcs) n.panic = 8;
    return;
  }
  if(G.money < it.p){ say('Not enough money.', 2.2); return; }
  G.money -= it.p;
  if(it.k === 'camera'){ G.inv.camera = true; say('Field Camera acquired. Wildlife can be tagged now.', 3.4); }
  else if(it.k === 'rod'){ G.inv.rod = true; say('Fishing Rod acquired. Find some water.', 3.4); }
  else if(it.k === 'console'){ G.inv.console = true; say('Game Console acquired. Needs a TV — you’ll need a home.', 4); }
  else if(it.k === 'snacks'){ G.inv.snacks++; say('Bought '+it.n+'.', 2); }
  else say('Bought '+it.n+'.', 2);
}

/* ---------- fishing minigame ---------- */
const fishUI = { t:0, pos:0, dir:1, speed:1.6, zone:0.20, tries:3, deep:false, done:false, result:'' };
function startFishing(deep){
  fishUI.t = 0; fishUI.pos = 0; fishUI.dir = 1;
  fishUI.speed = rr(1.1, 2.0); fishUI.zone = rr(0.16, 0.28);
  fishUI.deep = deep; fishUI.done = false; fishUI.result = '';
  G.overlay = 'fish';
}
function resolveFish(quality){
  const pool = FISH_SPECIES.filter(f => f.deep === (fishUI.deep ? 1 : 0));
  let sp = null;
  const luck = quality * 6;
  for(let k=0;k<14;k++){
    const cand = pick(pool);
    if(rnd()*cand.rare < luck/cand.rare + 0.25){ sp = cand; break; }
  }
  if(!sp) sp = pool[0];
  const lb = (rr(0.6, 8) * (1 + sp.rare*0.5)).toFixed(1);
  const isNew = !G.guideFish[sp.n];
  G.guideFish[sp.n] = Math.max(G.guideFish[sp.n]||0, parseFloat(lb));
  G.stats.caught++;
  const val = Math.round(4 + sp.rare*11 + parseFloat(lb)*3);
  G.money += val;
  fishUI.result = (isNew?'NEW — ':'') + sp.n + '  ' + lb + ' lb   (+$' + val + ')';
  fishUI.done = true;
}

/* ---------- console minigame (a game inside the game) ---------- */
const mini = {
  running:false, x:0, y:0, vx:0, score:0, best:0, t:0, blocks:[], dead:false, spawn:0
};
function startMini(){
  mini.running = true; mini.x = 0; mini.y = 0; mini.vx = 0;
  mini.score = 0; mini.t = 0; mini.blocks = []; mini.dead = false; mini.spawn = 0;
  G.overlay = 'console';
}
function updateMini(dt){
  if(mini.dead){
    if(K.Apress()){ startMini(); }
    if(K.Bpress()){ G.overlay = null; mini.running = false; }
    return;
  }
  mini.t += dt;
  const acc = 620;
  if(K.left())  mini.vx -= acc*dt;
  if(K.right()) mini.vx += acc*dt;
  mini.vx *= Math.pow(0.0015, dt);
  mini.x = clamp(mini.x + mini.vx*dt, -140, 140);
  mini.spawn -= dt;
  const rate = Math.max(0.16, 0.52 - mini.t*0.006);
  if(mini.spawn <= 0){
    mini.spawn = rate;
    mini.blocks.push({ x: rr(-140,140), y: -190, w: rr(24,58), s: rr(150, 150 + mini.t*7) });
  }
  const speedUp = 1 + mini.t*0.02;
  for(let i=mini.blocks.length-1;i>=0;i--){
    const b = mini.blocks[i];
    b.y += b.s*dt*speedUp;
    if(b.y > 210){ mini.blocks.splice(i,1); mini.score++; continue; }
    if(Math.abs(b.y - 150) < 16 && Math.abs(b.x - mini.x) < b.w/2 + 11){ mini.dead = true; }
  }
  if(mini.dead){
    mini.best = Math.max(mini.best, mini.score);
    G.money += mini.score;
  }
  if(K.Bpress()){ G.overlay = null; mini.running = false; }
}

/* ============================ UPDATE =================================== */
function update(dt){
  G.t += dt;
  if(G.msgT > 0) G.msgT -= dt;

  if(G.phase !== 'play') return;

  // clock: one in-game day == 12 real minutes
  G.clock += dt * (1440/720);
  if(G.clock >= 1440){ G.clock -= 1440; G.day++; chargeRent(); }

  // B-hold opens the phone
  if(G.overlay === null && G.mode !== 'none'){
    if(K.B()) bHold += dt; else bHold = 0;
    if(bHold > 0.45){ bHold = -99; phone.sel = 0; phone.page = 'main'; G.overlay = 'phone'; consume('x'); }
  }

  if(G.overlay){ updateOverlay(dt); return; }

  if(G.mode === 'interior'){ updateInterior(dt); return; }

  streamWorld();
  updatePlayerWorld(dt);
  updateCars(dt);
  updatePeds(dt);
  updateAnimals(dt);
  updateWanted(dt);
  updateParticles(dt);
  updateLights(dt);
}

function updateLights(dt){
  for(const n of nodes) if(n.light) n.lightPhase += dt*0.28;
}

function chargeRent(){
  let owed = 0;
  for(const id of G.props){
    const b = buildings[id];
    if(b && b.type === BT.APT) owed += Math.round(b.price * 0.02);
  }
  if(owed > 0){
    if(G.money >= owed){ G.money -= owed; say('Rent paid: $'+owed, 3); }
    else{
      say('You missed rent. You lost an apartment.', 4);
      const i = G.props.findIndex(id => buildings[id] && buildings[id].type === BT.APT);
      if(i !== -1){ buildings[G.props[i]].owned = false; G.props.splice(i,1); }
    }
  }
}

/* ---------- collision helpers ---------- */
function collideCircleBuildings(x, y, r){
  const list = buildingsNear(x, y, r + 200);
  let nx = x, ny = y, hit = false;
  for(const b of list){
    const hw = b.w/2 + r, hh = b.h/2 + r;
    const dx = nx - b.x, dy = ny - b.y;
    if(Math.abs(dx) < hw && Math.abs(dy) < hh){
      // push out along the shallowest axis
      const px = hw - Math.abs(dx), py = hh - Math.abs(dy);
      if(px < py) nx = b.x + Math.sign(dx || 1)*hw;
      else        ny = b.y + Math.sign(dy || 1)*hh;
      hit = true;
    }
  }
  return { x:nx, y:ny, hit };
}

function updatePlayerWorld(dt){
  if(P.car){ updatePlayerCar(dt); return; }

  P.run = K.B();
  const spd = P.run ? 205 : 118;
  let mx = 0, my = 0;
  if(K.left()) mx -= 1; if(K.right()) mx += 1;
  if(K.up())   my -= 1; if(K.down())  my += 1;
  const m = Math.hypot(mx,my);
  if(m > 0){
    mx/=m; my/=m;
    P.a = angLerp(P.a, Math.atan2(my,mx), 1 - Math.pow(0.0001, dt));
    P.walkT += dt * (P.run ? 13 : 8);
  }
  let nx = P.x + mx*spd*dt, ny = P.y + my*spd*dt;

  // water blocks you on foot (no swimming in v1 — you get a wet-feet nudge)
  if(isWaterAt(nx, ny)){
    if(!isWaterAt(nx, P.y)) ny = P.y;
    else if(!isWaterAt(P.x, ny)) nx = P.x;
    else { nx = P.x; ny = P.y; }
  }
  const c = collideCircleBuildings(nx, ny, P.r);
  nx = c.x; ny = c.y;
  P.x = clamp(nx, 20, WORLD-20); P.y = clamp(ny, 20, WORLD-20);

  // --- context action
  if(K.Apress()) doContextAction();
}

function doContextAction(){
  // 1. door?
  const b = nearestBuildingDoor(P.x, P.y, 34);
  if(b){ enterBuilding(b); return; }
  // 2. car?
  const c = nearestCar(P.x, P.y, 46);
  if(c){ enterCar(c); return; }
  // 3. animal + camera?
  const a = nearestAnimal(P.x, P.y, 150);
  if(a && G.inv.camera && !a.tagged){
    a.tagged = true; a.flee = 3.2;
    const isNew = !G.guideLand[a.sp.n];
    G.guideLand[a.sp.n] = (G.guideLand[a.sp.n] || 0) + 1;
    G.stats.tagged++;
    const val = 8 + a.sp.rare*14;
    G.money += val;
    say((isNew?'NEW SPECIES — ':'Tagged ') + a.sp.n + '  (+$'+val+')', 3.4);
    return;
  }
  // 4. water + rod?
  const w = waterNear(P.x, P.y, 46);
  if(w && G.inv.rod){ startFishing(cellDeep[cellAt(clamp(Math.floor(w.x/CELL),0,GN-1), clamp(Math.floor(w.y/CELL),0,GN-1))] === 1); return; }
  if(w && !G.inv.rod){ say('You could fish here with a rod.', 2.6); return; }
  // 5. person?
  const p = nearestPed(P.x, P.y, 44);
  if(p){
    if(G.org && !p.follow){
      if(G.money >= 500){
        G.money -= 500; p.follow = true; p.recruit = true;
        G.org.members++; G.org.influence += 2;
        p.chat = 3; p.chatTxt = 'I’m in.';
        say('Recruited into ' + G.org.name + '.  (-$500)', 3.2);
      } else { p.chat = 2.4; p.chatTxt = 'Talk to me when you have $500.'; }
    } else {
      p.chat = 2.4; p.chatTxt = pick(PED_CHAT);
    }
    return;
  }
  if(a && !G.inv.camera){ say('You need a Field Camera to record wildlife.', 2.8); return; }
  say('Nothing here.', 1.4);
}

function updatePlayerCar(dt){
  const c = P.car;
  const rev = c.sp < -4;
  let throttle = 0;
  if(K.up())   throttle += 1;
  if(K.down()) throttle -= 1;
  const steerInput = (K.right()?1:0) - (K.left()?1:0);

  const brake = K.B();
  const onRoad = nearRoad(c.x, c.y);
  const grip   = onRoad ? 1 : 0.62;

  if(throttle > 0) c.sp += c.acc*dt*grip;
  else if(throttle < 0) c.sp -= c.acc*1.05*dt*grip;
  if(brake) c.sp *= Math.pow(0.06, dt);

  const drag = onRoad ? 0.62 : 0.34;
  c.sp *= Math.pow(drag, dt);
  c.sp = clamp(c.sp, -c.top*0.42, c.top * (onRoad?1:0.62));

  const steerRate = 2.5 * clamp(Math.abs(c.sp)/120, 0, 1.25) * (rev?-1:1);
  c.a += steerInput * steerRate * dt;

  const nx = c.x + Math.cos(c.a)*c.sp*dt;
  const ny = c.y + Math.sin(c.a)*c.sp*dt;
  G.stats.milesDriven += Math.abs(c.sp)*dt / MI;

  let fx = nx, fy = ny;
  if(isWaterAt(fx,fy)){
    // cars don't float — you get shoved back with a splash
    for(let k=0;k<6;k++) particles.push({x:c.x,y:c.y,vx:rr(-60,60),vy:rr(-60,60),life:0.6,c:'#bfe4ff',r:rr(3,7)});
    c.sp *= -0.24; fx = c.x; fy = c.y;
  }
  const col = collideCircleBuildings(fx, fy, Math.max(c.L,c.Wd)*0.42);
  if(col.hit){
    const impact = Math.abs(c.sp);
    if(impact > 120){
      crashFx(c.x, c.y, impact);
      c.damage = Math.min(100, c.damage + impact*0.06);
    }
    c.sp *= -0.22;
  }
  c.x = clamp(col.x, 30, WORLD-30); c.y = clamp(col.y, 30, WORLD-30);

  // car-to-car impacts
  for(const o of cars){
    if(o === c) continue;
    const rad = (c.L + o.L)*0.34;
    if(dist2(c.x,c.y,o.x,o.y) < rad*rad){
      const ang = Math.atan2(o.y-c.y, o.x-c.x);
      const rel = Math.abs(c.sp) + Math.abs(o.sp)*0.4;
      o.x += Math.cos(ang)*3.0; o.y += Math.sin(ang)*3.0;
      c.x -= Math.cos(ang)*2.2; c.y -= Math.sin(ang)*2.2;
      if(rel > 150){
        crashFx((c.x+o.x)/2, (c.y+o.y)/2, rel);
        o.crashed = true; o.crashT = rr(5,10); o.sp = 0; o.angry = 1;
        c.sp *= -0.2;
        G.stats.crashesSeen++;
        if(o.police) addHeat(1, 'You hit a police car.');
        else if(rnd()<0.5) addHeat(0.5, '');
      } else {
        o.honk = Math.max(o.honk, 1.2);
        c.sp *= 0.86;
      }
    }
  }

  // running people over is not a thing here — they dive out of the way
  for(const p of peds){
    if(dist2(c.x,c.y,p.x,p.y) < 40*40 && Math.abs(c.sp) > 40){
      const ang = Math.atan2(p.y-c.y, p.x-c.x);
      p.x += Math.cos(ang)*70*dt*6; p.y += Math.sin(ang)*70*dt*6;
      p.panic = 3.4;
      if(!p.chat){ p.chat = 2; p.chatTxt = pick(['WATCH IT!','WHOA!','HEY!!','CAREFUL!']); }
      if(Math.abs(c.sp) > 200 && rnd() < 0.02) addHeat(0.4, '');
    }
  }

  if(K.Apress()){
    if(Math.abs(c.sp) < 60) exitCar();
    else say('Slow down first.', 1.4);
  }
}

function nearRoad(x,y){
  const list = nearEdges(x,y);
  for(const ei of list){
    const e = edges[ei];
    const d = segDist(x,y,e.x1,e.y1,e.x2,e.y2);
    if(d < e.w*0.62) return true;
  }
  return false;
}
function segDist(px,py,x1,y1,x2,y2){
  const dx = x2-x1, dy = y2-y1;
  const L2 = dx*dx+dy*dy;
  if(L2 === 0) return dist(px,py,x1,y1);
  let t = ((px-x1)*dx + (py-y1)*dy)/L2;
  t = clamp(t,0,1);
  return dist(px,py, x1+dx*t, y1+dy*t);
}

function crashFx(x,y,power){
  const n = clamp(Math.floor(power/22), 4, 22);
  for(let i=0;i<n;i++){
    particles.push({ x, y, vx:rr(-160,160), vy:rr(-160,160), life:rr(0.4,1.0),
      c: pick(['#ffd166','#ff8a3d','#fff1c9','#c9c9c9']), r:rr(2,6) });
  }
  for(let i=0;i<4;i++) particles.push({x,y,vx:rr(-40,40),vy:rr(-40,40),life:rr(0.9,1.6),c:'#5a5a5a',r:rr(7,15)});
}

/* ---------- AI traffic ---------- */
function updateCars(dt){
  const pp = playerPos();
  for(const c of cars){
    if(c === P.car) continue;
    if(c.direct) continue;          // close-range pursuit drives this car instead
    if(c.parked){ continue; }
    if(c.honk > 0) c.honk -= dt;
    if(c.blink > 0) c.blink -= dt;

    if(c.crashed){
      c.crashT -= dt;
      c.sp *= Math.pow(0.02, dt);
      if(c.angry > 0 && c.crashT < 6 && c.driver){
        c.driver = null;
        peds.push({ x:c.x+Math.cos(c.a+1.6)*24, y:c.y+Math.sin(c.a+1.6)*24, a:c.a+1.6, sp:44, walkT:0,
          shirt:pick(['#d95f5f','#5f8fd9','#e0c060','#60c090']), pants:'#2e3a48',
          skin:pick(['#f0c8a0','#d9a877','#b07d4f','#8a5a34']),
          panic:0, chat:4.5, chatTxt:pick(YELLS), recruit:false, follow:false, mood:0, edge:-1, dir:1 });
        c.angry = 0;
      }
      if(c.crashT <= 0){ c.crashed = false; c.driver = c.driver || {}; }
      continue;
    }
    if(!c.driver) continue;

    // follow the current edge toward its target node
    if(c.edge < 0 || c.tgt < 0){ c.parked = true; continue; }
    const tn = nodes[c.tgt];
    const toA = Math.atan2(tn.y - c.y, tn.x - c.x);
    c.a = angLerp(c.a, toA, 1 - Math.pow(0.0008, dt));

    // desired speed — police in pursuit push hard
    const hunting = c.police && G.wanted > 0;
    let want = c.top * (hunting ? 0.94 : 0.62);

    // red light at the node ahead
    const dTo = dist(c.x,c.y,tn.x,tn.y);
    if(tn.light && dTo < 150 && !hunting){       // sirens don't stop for red
      const green = ((Math.sin(tn.lightPhase) > 0) === (Math.abs(Math.cos(c.a)) > Math.abs(Math.sin(c.a))));
      if(!green && dTo > 46) want = 0;
    }
    // car ahead?
    for(const o of cars){
      if(o === c) continue;
      const dx = o.x-c.x, dy = o.y-c.y;
      const fwd = dx*Math.cos(c.a) + dy*Math.sin(c.a);
      const side = Math.abs(-dx*Math.sin(c.a) + dy*Math.cos(c.a));
      if(fwd > 0 && fwd < 92 && side < 26){ want = Math.min(want, Math.max(0, o.sp*0.8 - 14)); }
    }
    // the player on foot counts too — cars are not murder weapons here
    if(!P.car){
      const dx = P.x-c.x, dy = P.y-c.y;
      const fwd = dx*Math.cos(c.a)+dy*Math.sin(c.a);
      const side = Math.abs(-dx*Math.sin(c.a)+dy*Math.cos(c.a));
      if(fwd > 0 && fwd < 78 && side < 24) want = 0;
    }

    if(c.sp < want) c.sp += c.acc*dt;
    else c.sp -= c.acc*1.4*dt;
    c.sp = clamp(c.sp, 0, c.top);

    // jam behaviour: honking, then a driver gets out and yells
    if(c.sp < 16){
      c.stuck += dt;
      if(c.stuck > 2.2 && c.honk <= 0){ c.honk = 1.4; }
      if(c.stuck > 9 && rnd() < dt*0.5){
        c.driver = null; c.stuck = 0;
        peds.push({ x:c.x+Math.cos(c.a+1.6)*24, y:c.y+Math.sin(c.a+1.6)*24, a:c.a+1.6, sp:40, walkT:0,
          shirt:pick(['#d95f5f','#5f8fd9','#e0c060']), pants:'#2e3a48',
          skin:pick(['#f0c8a0','#d9a877','#b07d4f','#5f3d22']),
          panic:0, chat:5, chatTxt:pick(YELLS), recruit:false, follow:false, mood:0, edge:-1, dir:1,
          returnTo:c });
      }
    } else c.stuck = Math.max(0, c.stuck - dt);

    c.x += Math.cos(c.a)*c.sp*dt;
    c.y += Math.sin(c.a)*c.sp*dt;

    // reached the node — pick the next edge, preferring to go straight
    if(dTo < 40){
      const opts = tn.edges.filter(ei=>{
        const e = edges[ei];
        const other = e.a === c.tgt ? e.b : e.a;
        return other !== c.prevNode;
      });
      const use = opts.length ? opts : tn.edges;
      if(!use.length){ c.parked = true; continue; }
      let bestEi = use[0], bestScore = -1e9;
      const hereD = dist(tn.x, tn.y, pp.x, pp.y);
      for(const ei of use){
        const e = edges[ei];
        const other = e.a === c.tgt ? e.b : e.a;
        const on = nodes[other];
        const ang = Math.atan2(on.y-tn.y, on.x-tn.x);
        let d = Math.abs(((ang - c.a + Math.PI*3) % TAU) - Math.PI);
        let score = -d + rnd()*0.7 + (e.hwy?0.5:0);
        if(hunting){
          // police close the distance instead of drifting with traffic
          const gain = (hereD - dist(on.x, on.y, pp.x, pp.y)) / NS;
          score = gain*3.2 + rnd()*0.35;
        }
        if(score > bestScore){ bestScore = score; bestEi = ei; }
      }
      const e = edges[bestEi];
      c.prevNode = c.tgt;
      c.tgt = (e.a === c.prevNode) ? e.b : e.a;
      c.edge = bestEi;
    }
  }
}

/* ---------- pedestrians ---------- */
function updatePeds(dt){
  const pp = playerPos();
  for(let i=peds.length-1;i>=0;i--){
    const p = peds[i];
    if(p.chat > 0) p.chat -= dt;
    if(p.panic > 0) p.panic -= dt;

    if(p.follow){
      // org members walk with you
      const d = dist(p.x,p.y,pp.x,pp.y);
      if(d > 60){
        const ang = Math.atan2(pp.y-p.y, pp.x-p.x);
        p.a = angLerp(p.a, ang, 1-Math.pow(0.001,dt));
        const sp = d > 220 ? 190 : 105;
        p.x += Math.cos(p.a)*sp*dt; p.y += Math.sin(p.a)*sp*dt;
        p.walkT += dt*9;
      }
      if(d > 1400){ p.x = pp.x + rr(-70,70); p.y = pp.y + rr(-70,70); }  // don't lose your crew
      continue;
    }

    let sp = p.sp;
    if(p.panic > 0){ sp = 150; }
    else if(G.wanted >= 3 && dist(p.x,p.y,pp.x,pp.y) < 260){ sp = 130; p.a = Math.atan2(p.y-pp.y, p.x-pp.x); }

    if(rnd() < dt*0.35 && p.panic <= 0) p.a += rr(-0.7,0.7);
    const nx = p.x + Math.cos(p.a)*sp*dt, ny = p.y + Math.sin(p.a)*sp*dt;
    if(isWaterAt(nx,ny) || collideCircleBuildings(nx,ny,7).hit){ p.a += Math.PI*rr(0.6,1.4); }
    else { p.x = nx; p.y = ny; }
    p.walkT += dt * (sp/26);
    p.x = clamp(p.x, 10, WORLD-10); p.y = clamp(p.y, 10, WORLD-10);
  }
}

/* ---------- wildlife ---------- */
function updateAnimals(dt){
  const pp = playerPos();
  for(const a of animals){
    a.t += dt;
    if(a.flee > 0) a.flee -= dt;
    const d = dist(a.x,a.y,pp.x,pp.y);
    const spooked = d < (P.car ? 260 : 150) || a.flee > 0;
    if(spooked){
      a.a = angLerp(a.a, Math.atan2(a.y-pp.y, a.x-pp.x), 1-Math.pow(0.002,dt));
      a.spd = lerp(a.spd, a.sp.s*11, dt*3);
    } else {
      if(rnd() < dt*0.5) a.wander += rr(-1.2,1.2);
      a.a = angLerp(a.a, a.wander, 1-Math.pow(0.02,dt));
      a.spd = lerp(a.spd, 22 + Math.sin(a.t*0.5)*12, dt*2);
    }
    const nx = a.x + Math.cos(a.a)*a.spd*dt, ny = a.y + Math.sin(a.a)*a.spd*dt;
    const t = typeAtWorld(nx,ny);
    if(t === T_WATER || collideCircleBuildings(nx,ny,a.sp.s*0.5).hit){ a.a += Math.PI*rr(0.5,1.5); a.wander = a.a; }
    else { a.x = nx; a.y = ny; }
  }
}

/* ---------- police / wanted ---------- */
function updateWanted(dt){
  const pp = playerPos();
  if(G.wanted > 0){
    G.wantedHeat -= dt;
    let seen = false;
    const notice = 520 + G.wanted*170;      // more stars, wider net
    for(const c of cops){
      if(dist(c.x,c.y,pp.x,pp.y) < notice){ seen = true; c.chase = 4; c.direct = true; }
      if(c.chase > 0){
        c.chase -= dt;
        // steer straight at the player
        const ang = Math.atan2(pp.y-c.y, pp.x-c.x);
        c.a = angLerp(c.a, ang, 1-Math.pow(0.0004,dt));
        c.sp = Math.min(c.top, c.sp + c.acc*1.2*dt);
        const nx = c.x + Math.cos(c.a)*c.sp*dt, ny = c.y + Math.sin(c.a)*c.sp*dt;
        if(!isWaterAt(nx,ny)){
          const col = collideCircleBuildings(nx,ny,c.L*0.4);
          if(col.hit) c.sp *= 0.5;
          c.x = col.x; c.y = col.y;
        } else { c.sp *= 0.4; }
        c.driver = c.driver || {};
        // busted?
        if(dist(c.x,c.y,pp.x,pp.y) < (P.car ? 44 : 30)){
          G.arrestT += dt * (P.car ? 0.7 : 1.6);
          if(G.arrestT > 1.0) doArrest();
        }
      } else if(c.direct){
        reacquireEdge(c);            // lost you up close — rejoin the road and keep hunting
      }
    }
    if(seen) G.wantedHeat = Math.max(G.wantedHeat, 6);
    if(!seen) G.arrestT = Math.max(0, G.arrestT - dt);
    if(G.wantedHeat <= 0){
      G.wanted = Math.max(0, G.wanted - 1);
      G.wantedHeat = G.wanted > 0 ? 14 : 0;
      if(G.wanted === 0){
        say('You lost them.', 3);
        for(const c of cops){ c.chase = 0; if(c.direct) reacquireEdge(c); }
      }
    }
  } else {
    G.arrestT = Math.max(0, G.arrestT - dt*2);
    for(const c of cops){ c.chase = 0; if(c.direct) reacquireEdge(c); }
  }
}
function doArrest(){
  const fine = Math.min(G.money, Math.round(G.money*0.25) + 50);
  G.money -= fine;
  G.stats.arrests++;
  G.wanted = 0; G.wantedHeat = 0; G.arrestT = 0;
  if(P.car) exitCar();
  // released outside the nearest station-ish building in the nearest district
  let best = DISTRICTS[0], bd = 1e18;
  for(const d of DISTRICTS){ const dd = dist2(d.x,d.y,P.x,P.y); if(dd<bd){bd=dd;best=d;} }
  P.x = best.x; P.y = best.y;
  let guard = 0;
  while(isWaterAt(P.x,P.y) && guard++ < 60){ P.x += rr(-200,200); P.y += rr(-200,200); }
  for(const c of cops) c.chase = 0;
  G.overlay = 'arrest'; G.arrestMsg = 'Fine: $'+fine;
  G.clock = (G.clock + 300) % 1440;
  say('', 0);
}

/* ---------- particles ---------- */
function updateParticles(dt){
  for(let i=particles.length-1;i>=0;i--){
    const p = particles[i];
    p.life -= dt;
    if(p.life <= 0){ particles.splice(i,1); continue; }
    p.x += p.vx*dt; p.y += p.vy*dt;
    p.vx *= Math.pow(0.2,dt); p.vy *= Math.pow(0.2,dt);
  }
}

/* ---------- interior update ---------- */
function updateInterior(dt){
  const I = G.interior;
  const spd = K.B() ? 190 : 110;
  let mx=0,my=0;
  if(K.left())mx-=1; if(K.right())mx+=1; if(K.up())my-=1; if(K.down())my+=1;
  const m = Math.hypot(mx,my);
  if(m>0){ mx/=m; my/=m; P.ia = angLerp(P.ia, Math.atan2(my,mx), 1-Math.pow(0.0001,dt)); P.walkT += dt*9; }
  let nx = P.ix + mx*spd*dt, ny = P.iy + my*spd*dt;

  const R = 10;
  const solids = I.walls.concat(I.furn.filter(f=>f.kind!=='plant'));
  for(const s of solids){
    const hw = s.w/2 + R, hh = s.h/2 + R;
    const dx = nx - s.x, dy = ny - s.y;
    if(Math.abs(dx) < hw && Math.abs(dy) < hh){
      const px = hw - Math.abs(dx), py = hh - Math.abs(dy);
      if(px < py) nx = s.x + Math.sign(dx||1)*hw; else ny = s.y + Math.sign(dy||1)*hh;
    }
  }
  nx = clamp(nx, -I.w/2+16, I.w/2-16);
  ny = clamp(ny, -I.h/2+16, I.h/2+30);
  P.ix = nx; P.iy = ny;

  for(const n of I.npcs){
    n.t += dt;
    if(n.panic > 0){ n.panic -= dt; n.x += Math.cos(n.t*7)*90*dt; n.y += Math.sin(n.t*5)*70*dt; }
    else { n.x = lerp(n.x, n.hx + Math.sin(n.t*0.6)*8, dt*2); n.y = lerp(n.y, n.hy + Math.cos(n.t*0.5)*6, dt*2); }
  }

  if(K.Apress()){
    // exit?
    if(P.iy > I.h/2 - 34 && Math.abs(P.ix) < 30){ leaveBuilding(); return; }
    // interaction spot?
    let best=null, bd=52*52;
    for(const s of I.spots){ const d = dist2(P.ix,P.iy,s.x,s.y); if(d<bd){bd=d;best=s;} }
    if(best) useSpot(best);
    else say('Walk to the door (bottom) to leave.', 2);
  }
}
function useSpot(s){
  const b = G.interior.b;
  if(s.kind === 'buy'){ openShop(b); return; }
  if(s.kind === 'diner'){ openShop(b); return; }
  if(s.kind === 'bank'){
    if(G.money >= 0){
      shopUI.items = [
        {n:'Deposit is not a thing yet', p:0, k:'none'},
        {n:'— Rob the teller —', p:0, k:'robbank'}
      ];
      shopUI.sel = 0; shopUI.title = 'BANK'; shopUI.b = b;
      G.overlay = 'shop';
    }
    return;
  }
  if(s.kind === 'vault'){
    if(G.t - b.robbedAt < 300){ say('The vault is empty and the alarm is still ringing.', 3); return; }
    b.robbedAt = G.t;
    const take = Math.round(rr(2200, 7400));
    G.money += take; G.stats.robberies++;
    if(G.org) G.org.influence += 25;
    addHeat(4, 'VAULT: $'+take+'. Every siren in ' + (DISTRICTS[b.district] ? DISTRICTS[b.district].name : 'town') + ' just woke up.');
    for(const n of G.interior.npcs) n.panic = 10;
    return;
  }
  if(s.kind === 'tv'){
    if(!G.inv.console){ say('You need a game console. Try an electronics store.', 3); return; }
    if(!b.owned){ say('This isn’t your TV.', 2.4); return; }
    startMini(); return;
  }
  if(s.kind === 'bed'){
    if(!b.owned){ say('This isn’t your bed.', 2.4); return; }
    G.clock = 7*60; G.day++; chargeRent(); saveGame();
    say('Slept until morning. Day ' + G.day + '.', 3); return;
  }
  if(s.kind === 'buyhome'){
    if(b.owned){ say('You already own this.', 2); return; }
    if(G.money < b.price){ say('You need $'+b.price+'.', 2.6); return; }
    G.money -= b.price; b.owned = true; b.forSale = false;
    G.props.push(b.id);
    if(!G.home) G.home = b.id;
    G.interior.spots = G.interior.spots.filter(x=>x.kind!=='buyhome');
    say('You own it. ' + (b.type===BT.APT ? 'Rent is due daily.' : 'No rent, it’s yours.'), 4);
    return;
  }
  if(s.kind === 'reception'){
    say(pick(['"Do you have an appointment?"','"Lobby only, sorry."','"Elevators are down."','"Welcome in."']), 2.8);
    return;
  }
}

/* ---------- overlays ---------- */
function updateOverlay(dt){
  const o = G.overlay;
  if(o === 'phone'){
    const items = phoneItems();
    if(consume('arrowup')||consume('w')) phone.sel = (phone.sel - 1 + items.length) % items.length;
    if(consume('arrowdown')||consume('s')) phone.sel = (phone.sel + 1) % items.length;
    if(K.Apress()){
      const it = items[phone.sel];
      if(it.k === 'close') G.overlay = null;
      else if(it.k === 'map') G.overlay = 'map';
      else if(it.k === 'guide') G.overlay = 'guide';
      else if(it.k === 'found'){ G.overlay = null; askName('org','Name your organization','Nobody asked you to do this. Nobody will stop you either.','The Moor Syndicate'); }
      else if(it.k === 'disband'){ say(G.org.name + ' is finished.', 3); G.org = null; for(const p of peds) p.follow = false; G.overlay = null; }
      else if(it.k === 'save'){ saveGame(); say('Saved.', 2); G.overlay = null; }
      else if(it.k === 'org' || it.k === 'props' || it.k === 'stats'){ /* shown on the panel already */ }
    }
    if(K.Bpress()) G.overlay = null;
    return;
  }
  if(o === 'map' || o === 'guide'){
    if(K.Apress() || K.Bpress()) G.overlay = 'phone';
    return;
  }
  if(o === 'shop'){
    if(consume('arrowup')||consume('w')) shopUI.sel = (shopUI.sel - 1 + shopUI.items.length) % shopUI.items.length;
    if(consume('arrowdown')||consume('s')) shopUI.sel = (shopUI.sel + 1) % shopUI.items.length;
    if(K.Apress()){
      const it = shopUI.items[shopUI.sel];
      if(it.k === 'robbank'){
        G.overlay = null;
        const b = shopUI.b;
        if(G.t - b.robbedAt < 300){ say('Already hit. Try the vault another day.', 2.6); return; }
        b.robbedAt = G.t;
        const take = Math.round(rr(600, 2200));
        G.money += take; G.stats.robberies++;
        if(G.org) G.org.influence += 14;
        addHeat(3, 'You took $'+take+' from the teller.');
        if(G.interior) for(const n of G.interior.npcs) n.panic = 10;
        return;
      }
      if(it.k === 'none' && it.p === 0){ return; }
      buyItem(it);
    }
    if(K.Bpress()) G.overlay = null;
    return;
  }
  if(o === 'fish'){
    if(!fishUI.done){
      fishUI.t += dt;
      fishUI.pos += fishUI.dir * fishUI.speed * dt;
      if(fishUI.pos > 1){ fishUI.pos = 1; fishUI.dir = -1; }
      if(fishUI.pos < 0){ fishUI.pos = 0; fishUI.dir = 1; }
      if(K.Apress()){
        const centre = 0.5, half = fishUI.zone/2;
        const off = Math.abs(fishUI.pos - centre);
        if(off <= half) resolveFish(1 - off/half);
        else { fishUI.result = 'It got away.'; fishUI.done = true; }
      }
      if(K.Bpress()) G.overlay = null;
    } else {
      if(K.Apress()) startFishing(fishUI.deep);
      if(K.Bpress()) G.overlay = null;
    }
    return;
  }
  if(o === 'console'){ updateMini(dt); return; }
  if(o === 'arrest'){
    if(K.Apress() || K.Bpress()) G.overlay = null;
    return;
  }
}
