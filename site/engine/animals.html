<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>Legend Animals</title>
<style>
  html,body{margin:0;height:100%;overflow:hidden;background:#000;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif}
  canvas{display:block;position:fixed;inset:0;width:100%;height:100%}
  .bar{position:fixed;left:0;right:0;bottom:0;display:flex;gap:6px;flex-wrap:wrap;justify-content:center;padding:10px 8px calc(10px + env(safe-area-inset-bottom,0px));background:rgba(0,0,0,.55);backdrop-filter:blur(6px)}
  .bar button{background:#1a1a1a;border:1px solid #8B6914;color:#C9A84C;border-radius:14px;padding:8px 12px;font-size:12px;font-weight:600}
  .bar button.on{background:#C9A84C;color:#000}
  .acts{position:fixed;right:10px;top:calc(50% - 60px);display:flex;flex-direction:column;gap:8px}
  .acts button{background:rgba(0,0,0,.5);border:1px solid #8B6914;color:#C9A84C;border-radius:12px;padding:10px 12px;font-size:13px;font-weight:700}
  .tag{position:fixed;top:calc(8px + env(safe-area-inset-top,0px));left:12px;color:#C9A84C;font:700 13px Georgia,serif;letter-spacing:.18em}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div class="tag">♛ LEGEND ANIMALS</div>
<div class="acts" id="acts"></div>
<div class="bar" id="bar"></div>
<script src="legend-engine.js"></script>
<script>
  const SCENES = ['buck','family','herd','rabbits'];
  const kind = new URLSearchParams(location.search).get('g') || 'buck';
  const bar = document.getElementById('bar');
  for (const k of SCENES) {
    const b = document.createElement('button');
    b.textContent = k;
    if (k === kind) b.classList.add('on');
    b.onclick = ()=>{ location.search = '?g=' + k; };
    bar.appendChild(b);
  }
  const acts = document.getElementById('acts');
  function act(label, fn){ const b=document.createElement('button'); b.textContent=label; b.onclick=fn; acts.appendChild(b); }

  // Animals are the showcase — default straight to the top graphics tier
  // rather than auto-detecting down for a weaker device. A player who
  // can't hold the frame rate can still drop it via setGraphicsQuality().
  const game = LegendEngine.create({ canvas:'#c', quality:'ultra' });
  game.ground({ size: 60, grass: 'standard' });
  // Keep them calm for the showcase: the "threat" starts far away.
  game.animalThreat = { x: 999, y: 0, z: 999 };

  if (kind === 'buck') {
    game.animal({ species:'deer', sex:'male', size:'large', at:[0,0,0] });
    game.orbit({ center:[0,0.8,0], distance:3.6, height:1.4, autoRotate:0.14 });
  } else if (kind === 'family') {
    const doe = game.animal({ species:'deer', sex:'female', size:'medium', at:[0,0,0] });
    game.animal({ species:'deer', sex:'fawn', size:'small', at:[1,0,0.5], mother: doe });
    game.orbit({ center:[0,0.7,0], distance:5, height:1.8, autoRotate:0.1 });
  } else if (kind === 'herd') {
    game.herdOf({ species:'deer', count:6, at:[0,0,0], spread:5 });
    game.orbit({ center:[0,0.8,0], distance:11, height:3.2, autoRotate:0.08 });
  } else {
    for (let i=0;i<6;i++) game.animal({ species:'rabbit', sex: i%2?'female':'male', size:['small','medium','large'][i%3], at:[(i-2.5)*1.2, 0, (i%2)*1.5] });
    game.orbit({ center:[0,0.25,0], distance:4, height:1.4, autoRotate:0.12 });
  }
  act('😱 Spook', ()=>{ for (const a of game.animals) a.spook([0,0,0]); });
  act('🍃 Calm', ()=>{ for (const a of game.animals){ a.state='graze'; a.stateT=3; } });
  game.start();
  window.__game = game;
</script>
</body>
</html>
