<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>Bunker Nine</title>
<style>
  html, body { margin: 0; height: 100%; background: #05060a; overflow: hidden; }
  #game { position: fixed; inset: 0; width: 100%; height: 100%; }
  /* Build stamp: which version am I actually looking at?
     githack caches hard, so a page that looks stale usually IS stale, and
     there was no way to tell from inside the game. This says so, at the
     bottom, for eight seconds after load. The codename changes every time
     the build does -- if it reads the same as last time, the browser gave
     you the old file. */
  /* Visible from the first frame and faded out by script, NOT by a CSS
     animation. A composited opacity animation is invisible to a headless
     screenshot -- the DOM reports opacity 1 while nothing is drawn -- so
     the one element whose whole job is telling you which build you are
     looking at was the one element I could not check. Driven from JS it
     paints on the main thread and can be seen. */
  #build {
    position: fixed; left: 0; right: 0; bottom: 12px;
    text-align: center; pointer-events: none; z-index: 2147483000;
  }
  /* On its own chip, because the bottom of the screen is where the ammo
     counter lives and pale text over a dark bunker is not readable at a
     glance -- which is the whole job. */
  #build span {
    display: inline-block; padding: 5px 12px; border-radius: 999px;
    background: rgba(4, 7, 12, 0.82);
    border: 1px solid rgba(159, 232, 255, 0.30);
    font: 12px/1 ui-monospace, Menlo, Consolas, monospace;
    letter-spacing: 0.16em; text-transform: uppercase;
    color: #b8eeff; text-shadow: 0 1px 2px #000;
  }
</style>
</head>
<body>
<canvas id="game"></canvas>
<div id="build"><span>build &ldquo;cold kettle&rdquo; &middot; 2 sep</span></div>
<script src="../engine/legend-engine.js"></script>
<script src="bunker-nine.js"></script>
<script>
// The imported zombie body is fetched before the first frame so the pool can
// be built with it; if it is missing the game starts anyway on the
// procedural body.
BUNKER.preload().then(() => BUNKER.start({ canvas: '#game' }));
/* The build stamp stays up until you start playing, and is dismissed by
   the click that starts the game rather than by a timer.
   
   It was on a timer, and that was wrong twice over. A timer has to guess
   how long you need, and -- found the hard way -- a clock is not
   something to lean on: on the machine this is tested from, page time
   runs several times faster than wall time, so eight seconds of stamp
   had come and gone within two and a half seconds of real time and every
   screenshot I took to check it caught an empty screen. Tying it to the
   click you have to make anyway needs no clock at all, and puts it on
   screen for exactly as long as you are looking at the menu. */
(function () {
  var el = document.getElementById('build');
  if (!el) return;
  var go = function () { el.style.display = 'none'; };
  window.addEventListener('pointerdown', go, { once: true });
  window.addEventListener('keydown', go, { once: true });
})();
</script>
</body>
</html>
