<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>Survivor</title>
<link rel="icon" href="data:,">
<style>
  :root {
    --ink: #e8e3d8;
    --dim: #9a9384;
    --panel: rgba(12, 14, 12, 0.62);
    --edge: rgba(232, 227, 216, 0.14);
    --warn: #d9a441;
    --bad: #c4574a;
    --good: #7fa05a;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: #05070a; }
  body {
    font: 13px/1.45 ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    color: var(--ink);
    -webkit-font-smoothing: antialiased;
  }
  canvas { display: block; }

  /* ---------- loading ---------- */
  #boot {
    position: fixed; inset: 0; z-index: 50;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 22px; background: radial-gradient(ellipse at 50% 45%, #12181c 0%, #05070a 70%);
    transition: opacity .8s ease;
  }
  #boot h1 {
    margin: 0; font: 300 46px/1 ui-monospace, monospace; letter-spacing: .42em;
    text-indent: .42em; color: #e8e3d8;
  }
  #boot .sub { color: var(--dim); letter-spacing: .16em; font-size: 11px; text-transform: uppercase; }
  #bar { width: min(460px, 78vw); height: 2px; background: rgba(232,227,216,.14); overflow: hidden; }
  #bar i { display: block; height: 100%; width: 0; background: var(--ink); transition: width .3s ease; }
  #bootMsg { color: var(--dim); font-size: 12px; height: 1.4em; }
  #bootStats { color: var(--dim); font-size: 11px; text-align: center; max-width: 560px; line-height: 1.7; }
  #startBtn {
    margin-top: 6px; padding: 11px 30px; background: none; color: var(--ink); cursor: pointer;
    border: 1px solid var(--edge); font: inherit; letter-spacing: .22em; text-transform: uppercase;
    font-size: 11px; transition: background .2s, border-color .2s;
  }
  #startBtn:hover { background: rgba(232,227,216,.07); border-color: rgba(232,227,216,.4); }
  #startBtn[hidden] { display: none; }

  /* ---------- hud ---------- */
  #hud { position: fixed; inset: 0; pointer-events: none; z-index: 20; }
  .panel {
    position: absolute; background: var(--panel); border: 1px solid var(--edge);
    padding: 9px 12px; backdrop-filter: blur(9px); -webkit-backdrop-filter: blur(9px);
  }
  #vitals { left: 16px; bottom: 16px; width: 246px; }
  #env { right: 16px; top: 16px; width: 232px; text-align: right; }
  #status { left: 16px; top: 16px; width: 300px; }
  #log { right: 16px; bottom: 16px; width: 340px; max-height: 190px; overflow: hidden; }
  #prompt {
    left: 50%; bottom: 96px; transform: translateX(-50%); text-align: center;
    padding: 7px 16px; letter-spacing: .05em;
  }
  #prompt[hidden] { display: none; }

  .row { display: flex; justify-content: space-between; gap: 10px; align-items: baseline; }
  .k { color: var(--dim); font-size: 11px; }
  .v { font-variant-numeric: tabular-nums; }
  .meter { height: 3px; background: rgba(232,227,216,.12); margin: 3px 0 8px; overflow: hidden; }
  .meter i { display: block; height: 100%; background: var(--good); transition: width .4s linear, background .4s; }
  .meter.warn i { background: var(--warn); }
  .meter.bad i { background: var(--bad); }
  h2 {
    margin: 0 0 8px; font: 400 10px/1 inherit; letter-spacing: .24em;
    text-transform: uppercase; color: var(--dim);
  }
  #log div { font-size: 11.5px; color: var(--dim); margin-bottom: 3px; }
  #log div.hot { color: var(--ink); }
  #symptoms { color: var(--warn); font-size: 11.5px; margin-top: 6px; }

  #crosshair {
    position: fixed; left: 50%; top: 50%; width: 15px; height: 15px;
    transform: translate(-50%, -50%); z-index: 21; pointer-events: none; opacity: .55;
  }
  #crosshair::before, #crosshair::after {
    content: ''; position: absolute; background: var(--ink);
  }
  #crosshair::before { left: 50%; top: 0; width: 1px; height: 100%; margin-left: -.5px; }
  #crosshair::after { top: 50%; left: 0; height: 1px; width: 100%; margin-top: -.5px; }

  #compass {
    position: fixed; left: 50%; top: 14px; transform: translateX(-50%);
    z-index: 21; pointer-events: none; letter-spacing: .3em; font-size: 11px; color: var(--dim);
  }
  #compass b { color: var(--ink); font-weight: 400; }

  #help {
    position: fixed; left: 50%; bottom: 14px; transform: translateX(-50%);
    z-index: 21; font-size: 11px; color: var(--dim); letter-spacing: .06em; pointer-events: none;
  }
  #vignette {
    position: fixed; inset: 0; z-index: 19; pointer-events: none;
    box-shadow: inset 0 0 220px 40px rgba(0,0,0,.62); transition: box-shadow .6s;
  }
</style>

<div id="boot">
  <h1>SURVIVOR</h1>
  <div class="sub">one island &middot; one life</div>
  <div id="bar"><i></i></div>
  <div id="bootMsg">raising the island…</div>
  <div id="bootStats"></div>
  <button id="startBtn" hidden>Enter the island</button>
</div>

<div id="hud" hidden>
  <div class="panel" id="status">
    <h2>state</h2>
    <div id="statusBody"></div>
    <div id="symptoms"></div>
  </div>
  <div class="panel" id="vitals"></div>
  <div class="panel" id="env"></div>
  <div class="panel" id="log"><h2>log</h2><div id="logBody"></div></div>
  <div class="panel" id="prompt" hidden></div>
</div>
<div id="crosshair" hidden></div>
<div id="compass" hidden></div>
<div id="help" hidden>WASD move &middot; shift run &middot; C crouch &middot; space jump &middot; E interact &middot; F drink &middot; R rest &middot; T time&times;</div>
<div id="vignette"></div>

<script src="../engine/legend-engine.js"></script>
<script src="./survivor.js"></script>
<script src="./game.js"></script>
