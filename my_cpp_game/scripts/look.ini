# Live look overrides for the running game. Save this file and the change
# appears on the next frame -- no rebuild, no restart. Every key is listed
# by name in src/rendering/Tunables.cpp; vec3 values are "r g b".
#
# Uncomment to try:
# sun.intensity      = 4.4
# sun.direction      = 0.42 0.30 -0.86
# fog.density        = 0.0016
# volumetric.intensity = 0.9
# post.exposure      = 1.05
# post.toneMap       = 1          # 0 ACES, 1 AgX
