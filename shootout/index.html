<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Shootout</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<!-- 1. LOADING SCREEN: revolver fires, bullet hits the target -->
<section id="screen-loading" class="screen active">
  <canvas id="loading-canvas"></canvas>
  <div class="loading-text">LOADING<span class="dots"></span></div>
</section>

<!-- 2. MAIN MENU -->
<section id="screen-menu" class="screen">
  <div class="menu-bg"></div>
  <h1 class="title">SHOOTOUT</h1>
  <nav class="menu">
    <button data-go="mode">Play</button>
    <button data-go="settings">Settings</button>
    <button data-go="gunsmith">Gunsmith</button>
    <button data-go="loadout">Loadout</button>
  </nav>
</section>

<!-- 3. MODE SELECT: small black area with four green circles -->
<section id="screen-mode" class="screen">
  <div class="mode-box">
    <h2>Choose your table</h2>
    <div class="circles">
      <button class="circle" data-mode="solo"><span>Solo</span><small>1 player</small></button>
      <button class="circle" data-mode="duos"><span>Duos</span><small>2 players</small></button>
      <button class="circle" data-mode="trios"><span>Trios</span><small>3 players</small></button>
      <button class="circle bloody" data-mode="bloody"><span>Bloody Mary</span><small>4 players</small></button>
    </div>
    <button class="back" data-go="menu">Back</button>
  </div>
</section>

<!-- 4. THE ROOM / CARD TABLE -->
<section id="screen-game" class="screen">
  <canvas id="room-canvas"></canvas>
  <div class="vignette"></div>
  <div class="hud">
    <div id="round-label">ROUND 1</div>
    <div id="mode-label"></div>
  </div>
  <div id="opponent-hands"></div>
  <div id="table-pile"></div>
  <div id="card-info" class="hidden"></div>
  <div id="hand"></div>
  <div class="game-buttons">
    <button id="btn-cover" title="Cover your cards so nobody can see them">Cover cards</button>
    <button id="btn-quit">Quit</button>
  </div>
  <div id="status"></div>
  <div id="feed"></div>
  <div id="shootout" class="hidden"></div>
  <div id="hit-flash"></div>
  <div id="round-banner"></div>
  <div id="game-over" class="hidden">
    <h2 id="game-over-title"></h2>
    <p id="game-over-reason"></p>
    <div class="game-over-buttons">
      <button id="btn-again">Play again</button>
      <button id="btn-menu">Main menu</button>
    </div>
  </div>
</section>

<!-- SETTINGS -->
<section id="screen-settings" class="screen">
  <div class="panel">
    <h2>Settings</h2>
    <label>Music volume <input type="range" id="set-music" min="0" max="100" value="70"></label>
    <label>Effects volume <input type="range" id="set-sfx" min="0" max="100" value="80"></label>
    <label><input type="checkbox" id="set-blood" checked> Show blood</label>
    <button class="back" data-go="menu">Back</button>
  </div>
</section>

<!-- GUNSMITH (placeholder) -->
<section id="screen-gunsmith" class="screen">
  <div class="panel">
    <h2>Gunsmith</h2>
    <p class="soon">Customize your revolver here. Coming soon.</p>
    <button class="back" data-go="menu">Back</button>
  </div>
</section>

<!-- LOADOUT (placeholder) -->
<section id="screen-loadout" class="screen">
  <div class="panel">
    <h2>Loadout</h2>
    <p class="soon">Pick what you bring to the table. Coming soon.</p>
    <button class="back" data-go="menu">Back</button>
  </div>
</section>

<div id="fade"></div>

<script src="cards.js"></script>
<script src="audio.js"></script>
<script src="loading.js"></script>
<script src="room.js"></script>
<script src="game.js"></script>
</body>
</html>
